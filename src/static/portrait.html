<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI English Coach · 竖屏教材阅读器</title>
  <link rel="icon" type="image/png" href="/static/icon.png">
  <link rel="stylesheet" href="/static/style.css?v=2.4">
  <script src="/static/marked.min.js"></script>
  <style>
    :root {
      --bg-dark: #090d16;
      --surface-dark: #0f172a;
      --card-dark: #1e293b;
      --card-border: #334155;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --accent-glow: rgba(56, 189, 248, 0.25);
      --green: #4ade80;
      --amber: #fbbf24;
      --purple: #a855f7;
    }
    body {
      margin: 0;
      padding: 0;
      background: var(--bg-dark);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .portrait-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    /* Header */
    .portrait-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      background: rgba(15, 23, 42, 0.96);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      z-index: 100;
      height: 52px;
      box-sizing: border-box;
      gap: 12px;
    }
    .portrait-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .portrait-brand h1 {
      font-size: 16px;
      margin: 0;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--accent);
      white-space: nowrap;
    }
    .sync-status {
      font-size: 11px;
      padding: 3px 9px;
      border-radius: 12px;
      background: rgba(34, 197, 94, 0.15);
      color: var(--green);
      border: 1px solid rgba(34, 197, 94, 0.3);
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .sync-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
      animation: pulse-dot 2s infinite ease-in-out;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }

    .portrait-nav {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .portrait-nav select, .portrait-nav input {
      background: #1e293b;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 13px;
      height: 32px;
      box-sizing: border-box;
    }
    .portrait-nav select {
      max-width: 200px;
    }
    .portrait-nav select:focus {
      border-color: var(--accent);
      outline: none;
    }

    /* Top-Bottom Split Layout (上下栏布局) */
    .portrait-body {
      display: flex;
      flex-direction: column; /* 上下栏 */
      flex: 1;
      height: calc(100vh - 52px);
      overflow: hidden;
    }

    /* 上栏：教材完整页面大图视口 */
    .pdf-top-panel {
      height: var(--p-top-h, 58vh);
      flex: 0 0 auto;
      min-height: 120px;
      background: #060911;
      overflow: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }
    .pdf-viewport-inner {
      padding: 16px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-width: 100%;
      box-sizing: border-box;
    }
    .portrait-page-wrapper {
      position: relative;
      display: inline-block;
      max-width: 100%;
      transform-origin: top center;
      transition: transform 0.2s ease;
      user-select: none;
    }
    .pdf-page-img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.75);
      border: 1px solid #1e293b;
      display: block;
    }
    .pdf-highlight-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .pdf-sentence-box {
      position: absolute;
      pointer-events: auto;
      cursor: pointer;
      border-radius: 3px;
      transition: background-color 0.18s ease, box-shadow 0.18s ease;
      z-index: 10;
    }
    .pdf-sentence-box:hover {
      background: rgba(59, 130, 246, 0.22);
      box-shadow: 0 0 0 1.5px rgba(59, 130, 246, 0.5);
    }
    .pdf-sentence-box.active {
      background: rgba(250, 204, 21, 0.45);
      box-shadow: 0 0 0 2px rgba(234, 179, 8, 0.85), 0 2px 10px rgba(234, 179, 8, 0.35);
      z-index: 20;
      animation: p-highlight-pulse 2s infinite ease-in-out;
    }
    @keyframes p-highlight-pulse {
      0%, 100% {
        background: rgba(250, 204, 21, 0.45);
        box-shadow: 0 0 0 2px rgba(234, 179, 8, 0.85), 0 2px 10px rgba(234, 179, 8, 0.35);
      }
      50% {
        background: rgba(250, 204, 21, 0.65);
        box-shadow: 0 0 0 2.5px rgba(234, 179, 8, 1), 0 2px 14px rgba(234, 179, 8, 0.55);
      }
    }
    .pdf-floating-tools {
      position: absolute;
      top: 14px;
      right: 18px;
      display: flex;
      gap: 6px;
      background: rgba(15, 23, 42, 0.85);
      padding: 4px 8px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(6px);
      z-index: 10;
    }
    .tool-mini-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 12px;
      cursor: pointer;
    }
    .tool-mini-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
    }

    /* 竖屏上下拖拽分割条 */
    .portrait-resizer-v {
      height: 8px;
      flex: 0 0 8px;
      cursor: row-resize;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
      background: #111a2e;
      border-top: 1px solid #1e293b;
      border-bottom: 1px solid #1e293b;
      user-select: none;
      touch-action: none;
    }
    .portrait-resizer-v::after {
      content: "";
      width: 44px;
      height: 2px;
      background: #334155;
      border-radius: 2px;
      transition: all 0.2s ease;
    }
    .portrait-resizer-v:hover::after, .portrait-resizer-v.active::after {
      background: var(--accent);
      height: 4px;
      width: 80px;
      box-shadow: 0 0 10px var(--accent-glow);
    }

    /* 下栏：逐句精析与互动控制面板 */
    .sentences-bottom-panel {
      flex: 1 1 0;
      min-height: 160px;
      background: var(--surface-dark);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* 顶部视听展台与 16:9 原声视频剧场样式 */
    .p-stage-content {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    .pdf-top-panel.video-mode {
      background: #000 !important;
      overflow: hidden !important;
      padding: 0 !important;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: flex-start;
    }
    .p-video-stage {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      background: #000;
    }
    .p-video-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 14px;
      background: rgba(15, 23, 42, 0.96);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 12px;
      height: 38px;
      box-sizing: border-box;
      flex-shrink: 0;
      z-index: 10;
    }
    .p-video-header-left, .p-video-header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .p-video-badge {
      font-weight: 700;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }
    .p-video-ts {
      color: #94a3b8;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      background: rgba(255, 255, 255, 0.07);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .p-video-live-pill {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 12px;
      background: rgba(34, 197, 94, 0.15);
      color: var(--green);
      border: 1px solid rgba(34, 197, 94, 0.35);
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }
    .p-video-viewport {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      max-height: calc(100% - 38px);
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin: 0 auto;
    }
    #p-document-video-element {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      display: block;
    }
    .sentence-timestamp-pill {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      color: #94a3b8;
      background: rgba(255, 255, 255, 0.06);
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      margin-left: 6px;
    }
    .p-autoplay-unlock-banner {
      position: absolute;
      top: 42px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(234, 88, 12, 0.95);
      color: #ffffff;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
      z-index: 50;
      cursor: pointer;
      display: none;
      animation: pulse-border 1.5s infinite ease-in-out;
      border: 1px solid #fdba74;
      white-space: nowrap;
    }

    /* 浅色主题支持 (Light Theme Overrides) */
    [data-theme="light"] body {
      background: #f1f5f9;
      color: #0f172a;
    }
    [data-theme="light"] .p-video-header {
      background: rgba(255, 255, 255, 0.96);
      border-bottom-color: #cbd5e1;
    }
    [data-theme="light"] .p-video-ts {
      color: #64748b;
      background: rgba(0, 0, 0, 0.05);
      border-color: rgba(0, 0, 0, 0.1);
    }
    [data-theme="light"] .p-video-header .mini-icon-btn {
      background: #f1f5f9;
      border-color: #cbd5e1;
      color: #334155;
    }
    [data-theme="light"] .p-video-header .mini-icon-btn:hover {
      background: #e2e8f0;
      color: #0f172a;
    }
    [data-theme="light"] .portrait-header {
      background: rgba(255, 255, 255, 0.96);
      border-bottom-color: #cbd5e1;
    }
    [data-theme="light"] .portrait-brand h1 {
      color: #2563eb;
    }
    [data-theme="light"] .portrait-nav select,
    [data-theme="light"] .portrait-nav input {
      background: #ffffff;
      border-color: #cbd5e1;
      color: #0f172a;
    }
    [data-theme="light"] .portrait-nav .icon-btn {
      color: #334155 !important;
      background: #ffffff !important;
      border-color: #cbd5e1 !important;
    }
    [data-theme="light"] .pdf-top-panel {
      background: #e2e8f0;
    }
    [data-theme="light"] .portrait-resizer-v {
      background: #e2e8f0;
      border-color: #cbd5e1;
    }
    [data-theme="light"] .portrait-resizer-v::after {
      background: #94a3b8;
    }
    [data-theme="light"] .sentences-bottom-panel {
      background: #ffffff;
      box-shadow: 0 -4px 18px rgba(0, 0, 0, 0.08);
    }
    [data-theme="light"] .bottom-control-toolbar {
      background: #f8fafc;
      border-bottom-color: #e2e8f0;
    }
    [data-theme="light"] .sent-progress-pill {
      background: #ffffff;
      color: #0f172a;
      border-color: #cbd5e1;
    }
    [data-theme="light"] .current-focus-card {
      background: #f8fafc;
      border-color: #e2e8f0;
      border-left-color: #2563eb;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    [data-theme="light"] .focus-sentence-text {
      color: #0f172a;
    }
    [data-theme="light"] .sentence-card {
      background: #ffffff;
      border-color: #e2e8f0;
    }
    [data-theme="light"] .sentence-card:hover {
      background: #f8fafc;
      border-color: #cbd5e1;
    }
    [data-theme="light"] .sentence-card.active {
      background: #eff6ff;
      border-color: #93c5fd;
    }
    [data-theme="light"] .sentence-en {
      color: #0f172a;
    }
    [data-theme="light"] .sentence-meta-tag {
      background: #e0f2fe;
      color: #0284c7;
    }
    [data-theme="light"] .p-mode-badge {
      background: #eff6ff;
      border-color: #bfdbfe;
      color: #2563eb;
    }
    [data-theme="light"] .focus-translation-box {
      background: #f8fafc;
      border-color: #e2e8f0;
    }
    [data-theme="light"] .translation-text {
      color: #334155;
    }

    /* 下栏工具条 */
    .bottom-control-toolbar {
      padding: 10px 16px;
      background: #111a2e;
      border-bottom: 1px solid #1e293b;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .toolbar-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sent-progress-pill {
      font-size: 13px;
      font-weight: 700;
      color: #e2e8f0;
      background: #1e293b;
      padding: 4px 10px;
      border-radius: 14px;
      border: 1px solid #334155;
      min-width: 80px;
      text-align: center;
    }

    /* 核心“连续自动精讲”按钮 */
    .btn-continuous {
      background: linear-gradient(135deg, #2563eb, #0284c7);
      color: #fff;
      border: 1px solid #38bdf8;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 13px;
    }
    .btn-continuous:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(56, 189, 248, 0.5);
    }
    .btn-continuous.active {
      background: linear-gradient(135deg, #d97706, #b45309);
      border-color: #f59e0b;
      animation: pulse-border 1.8s infinite ease-in-out;
    }
    @keyframes pulse-border {
      0%, 100% { box-shadow: 0 0 10px rgba(245, 158, 11, 0.4); }
      50% { box-shadow: 0 0 20px rgba(245, 158, 11, 0.8); }
    }

    /* 当前选中句特写栏 */
    .current-focus-card {
      margin: 10px 16px 8px 16px;
      background: linear-gradient(145deg, #182235, #131c2d);
      border: 1px solid #2d3f5e;
      border-left: 4px solid var(--accent);
      border-radius: 10px;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
    }
    .focus-card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .focus-badge {
      font-size: 11px;
      font-weight: 700;
      color: var(--accent);
      background: rgba(56, 189, 248, 0.15);
      padding: 2px 8px;
      border-radius: 4px;
    }
    .focus-status-text {
      font-size: 12px;
      color: #94a3b8;
    }
    .focus-sentence-text {
      font-size: 16px;
      font-weight: 600;
      line-height: 1.5;
      color: #f8fafc;
      letter-spacing: -0.01em;
    }
    .focus-translation-box {
      margin-top: 2px;
      padding: 8px 12px;
      background: rgba(11, 17, 32, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 13px;
      line-height: 1.5;
      transition: all 0.2s ease;
    }
    .focus-translation-box.hidden {
      display: none;
    }
    .translation-prefix {
      font-size: 11px;
      font-weight: 700;
      color: var(--accent);
      background: rgba(56, 189, 248, 0.12);
      padding: 2px 6px;
      border-radius: 4px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .translation-text {
      color: #cbd5e1;
      flex: 1;
    }
    .p-mode-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 6px;
      background: rgba(56, 189, 248, 0.12);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.25);
      white-space: nowrap;
    }

    /* 滚动句子列表 */
    .sentences-scroll-area {
      flex: 1;
      overflow-y: auto;
      padding: 8px 16px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .sentence-card {
      background: #172133;
      border: 1px solid #273549;
      border-radius: 8px;
      padding: 10px 14px;
      cursor: pointer;
      transition: all 0.15s ease;
      position: relative;
    }
    .sentence-card:hover {
      background: #1e2c44;
      border-color: var(--accent);
      transform: translateY(-1px);
    }
    .sentence-card.active {
      background: rgba(56, 189, 248, 0.12);
      border-color: var(--accent);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.25);
    }
    .sentence-card.speaking {
      border-color: #4ade80;
      background: rgba(74, 222, 128, 0.12);
      box-shadow: 0 0 14px rgba(74, 222, 128, 0.3);
    }
    .sentence-card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .sentence-num {
      font-size: 11px;
      font-weight: 700;
      color: #94a3b8;
      background: #111a28;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .sentence-card.active .sentence-num {
      color: var(--accent);
      background: rgba(56, 189, 248, 0.2);
    }
    .sentence-actions-group {
      display: flex;
      gap: 6px;
    }
    .btn-act {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      background: #253348;
      color: #e2e8f0;
      border: 1px solid #334460;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-act:hover {
      background: var(--accent);
      color: #090d16;
      font-weight: 700;
      border-color: var(--accent);
    }
    .sentence-body-text {
      font-size: 14px;
      line-height: 1.5;
      color: #e2e8f0;
      font-weight: 500;
    }
    .inline-play-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      margin-left: 6px;
      padding: 1px 7px;
      border-radius: 12px;
      border: 1px solid #334460;
      background: #1e293b;
      color: #38bdf8;
      font-size: 12px;
      line-height: 18px;
      cursor: pointer;
      vertical-align: middle;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      user-select: none;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
    }
    .inline-play-btn:hover {
      background: #38bdf8;
      color: #090d16;
      border-color: #38bdf8;
      transform: scale(1.08);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
    }
    .inline-play-btn:active {
      transform: scale(0.96);
    }
    .inline-play-btn.playing {
      background: #0284c7;
      color: #ffffff;
      border-color: #38bdf8;
      animation: pulse-audio 1.2s infinite ease-in-out;
    }
    .focus-inline-play {
      font-size: 13px;
      padding: 2px 10px;
      border-radius: 14px;
      margin-left: 8px;
      font-weight: 600;
    }
    @keyframes pulse-audio {
      0% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.7); }
      70% { box-shadow: 0 0 0 8px rgba(56, 189, 248, 0); }
      100% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0); }
    }
    [data-theme="light"] .inline-play-btn {
      background: #f1f5f9;
      border-color: #cbd5e1;
      color: #0284c7;
    }
    [data-theme="light"] .inline-play-btn:hover {
      background: #0284c7;
      color: #ffffff;
      border-color: #0284c7;
    }
    [data-theme="light"] .inline-play-btn.playing {
      background: #0284c7;
      color: #ffffff;
      border-color: #0369a1;
    }

    /* 竖屏智能板书笔记区域 */
    .p-notes-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--surface-dark, #0b1120);
      margin: 8px 16px 16px 16px;
      border: 1px solid #273549;
      border-radius: 10px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.25);
    }
    .p-notes-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px;
      background: #131c2d;
      border-bottom: 1px solid #273549;
      flex-shrink: 0;
    }
    .p-notes-title-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .p-notes-title {
      font-size: 13px;
      font-weight: 700;
      color: #f8fafc;
    }
    .p-notes-status-badge {
      font-size: 11px;
      font-weight: 600;
      color: var(--accent);
      background: rgba(56, 189, 248, 0.15);
      padding: 2px 6px;
      border-radius: 4px;
    }
    .p-notes-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .p-notes-content {
      flex: 1;
      overflow-y: auto;
      padding: 14px 18px;
      font-size: 13.5px;
      line-height: 1.68;
      color: #e2e8f0;
      word-break: break-word;
    }
    .p-notes-content h1, .p-notes-content h2, .p-notes-content h3 {
      color: var(--accent);
      margin: 12px 0 6px 0;
      font-size: 14.5px;
      font-weight: 700;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 4px;
    }
    .p-notes-content p {
      margin: 6px 0;
    }
    .p-notes-content ul, .p-notes-content ol {
      padding-left: 20px;
      margin: 6px 0;
    }
    .p-notes-content li {
      margin: 3px 0;
    }
    .p-notes-content strong {
      color: #38bdf8;
      font-weight: 700;
    }
    .p-notes-content code {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 2px 5px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 12px;
      color: #f59e0b;
    }
    .p-notes-content pre {
      background: #090d16;
      border: 1px solid #1e293b;
      border-radius: 6px;
      padding: 10px;
      overflow-x: auto;
      font-family: monospace;
      font-size: 12px;
    }
    .p-notes-content .vocab-play-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: none;
      background: rgba(56, 189, 248, 0.2);
      color: var(--accent);
      font-size: 11px;
      cursor: pointer;
      margin-left: 4px;
      vertical-align: middle;
      transition: all 0.15s ease;
    }
    .p-notes-content .vocab-play-btn:hover {
      background: var(--accent);
      color: #000;
      transform: scale(1.1);
    }
    .p-notes-content .vocab-word-clickable {
      cursor: pointer;
      border-bottom: 1px dashed rgba(56, 189, 248, 0.6);
      transition: color 0.15s ease;
    }
    .p-notes-content .vocab-word-clickable:hover {
      color: var(--accent);
    }
    [data-theme="light"] .p-notes-container {
      background: #ffffff;
      border-color: #cbd5e1;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
    }
    [data-theme="light"] .p-notes-header {
      background: #f8fafc;
      border-bottom-color: #e2e8f0;
    }
    [data-theme="light"] .p-notes-title {
      color: #0f172a;
    }
    [data-theme="light"] .p-notes-content {
      color: #334155;
    }
    [data-theme="light"] .p-notes-content h1,
    [data-theme="light"] .p-notes-content h2,
    [data-theme="light"] .p-notes-content h3 {
      color: #0284c7;
      border-bottom-color: #e2e8f0;
    }
    [data-theme="light"] .p-notes-content strong {
      color: #0369a1;
    }

    .empty-prompt {
      text-align: center;
      color: #64748b;
      font-size: 13px;
      margin-top: 30px;
    }

    /* 竖屏全屏智能板书模式 (主屏全屏跟打联动 或 竖屏手动全屏) */
    .portrait-body.notes-fullscreen-active #pdf-panel,
    .portrait-body.notes-fullscreen-active #portrait-resizer-vertical,
    .portrait-body.notes-fullscreen-active .bottom-control-toolbar,
    .portrait-body.notes-fullscreen-active #p-shadow-typing-card,
    .portrait-body.notes-fullscreen-active #p-sentences-container {
      display: none !important;
    }

    .portrait-body.notes-fullscreen-active .sentences-bottom-panel {
      flex: 1 1 100% !important;
      height: 100% !important;
      max-height: 100% !important;
      padding: 0 !important;
      border-top: none !important;
    }

    .portrait-body.notes-fullscreen-active .p-notes-container {
      display: flex !important;
      flex: 1 1 100% !important;
      height: calc(100% - 46px) !important;
      margin: 6px 12px 12px 12px !important;
      border-radius: 12px;
      border-color: rgba(56, 189, 248, 0.4);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
    }

    .portrait-body.notes-fullscreen-active .p-notes-header {
      padding: 10px 18px;
      background: #0f172a;
      border-bottom-color: rgba(56, 189, 248, 0.25);
    }

    .portrait-body.notes-fullscreen-active .p-notes-title {
      font-size: 14.5px;
    }

    .portrait-body.notes-fullscreen-active .p-notes-status-badge.active {
      background: rgba(168, 85, 247, 0.2);
      color: #c084fc;
      border: 1px solid rgba(168, 85, 247, 0.4);
    }

    .portrait-body.notes-fullscreen-active .p-notes-content {
      font-size: 15px;
      line-height: 1.8;
      padding: 20px 26px;
    }

    .portrait-body.notes-fullscreen-active .p-notes-content h1,
    .portrait-body.notes-fullscreen-active .p-notes-content h2,
    .portrait-body.notes-fullscreen-active .p-notes-content h3 {
      font-size: 16px;
      margin: 16px 0 8px 0;
    }

    .portrait-body.notes-fullscreen-active .p-notes-content pre {
      font-size: 13.5px;
      line-height: 1.6;
      padding: 14px 18px;
      background: #070b13;
      border-color: #273549;
    }

    [data-theme="light"] .portrait-body.notes-fullscreen-active .p-notes-container {
      border-color: #38bdf8;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
    }
    [data-theme="light"] .portrait-body.notes-fullscreen-active .p-notes-header {
      background: #f1f5f9;
    }
  </style>

</head>
<body>
  <div class="portrait-container">
    <!-- Header -->
    <header class="portrait-header">
      <div class="portrait-brand">
        <h1>📖 竖屏教材端</h1>
        <div class="sync-status" id="sync-indicator">
          <span class="sync-dot"></span>
          <span id="sync-text">已连通</span>
        </div>
        <div class="hud-streak-pill" id="p-hud-streak" style="padding: 2px 8px; font-size: 11px; margin-left: 4px;" title="连续学习天数">🔥 <span id="p-hud-streak-days">1</span>天</div>
        <div class="hud-level-badge" id="p-hud-level" style="font-size: 11px; padding: 2px 8px;" title="当前段位">Lv.1 萌新</div>
      </div>

      <div class="portrait-nav">
        <a href="/" target="_blank" class="btn btn-quiet" style="padding: 4px 8px; font-size: 12px; height: 32px; text-decoration: none; display: inline-flex; align-items: center; color: inherit;" title="打开或聚焦横屏主控制台">🖥️ 主台</a>
        <button id="p-typing-dock-btn" class="btn btn-outline" style="padding: 4px 10px; font-size: 12px; height: 32px;" title="切换打字练习区停靠位置 (在竖屏打字 / 移至横屏)">⌨️ 竖屏跟打</button>
        <button id="p-notes-dock-btn" class="btn btn-outline" style="padding: 4px 10px; font-size: 12px; height: 32px;" title="切换智能板书停靠位置 (在竖屏展示 / 移至横屏)">📝 竖屏板书</button>
        <button id="p-theme-toggle-btn" class="btn btn-quiet" style="padding: 4px 10px; font-size: 12px; height: 32px;" title="切换深色/浅色外观">
          <span id="p-theme-icon">🌙</span> <span id="p-theme-text">深色</span>
        </button>
        <select id="p-doc-select" aria-label="教材"></select>
        <select id="p-unit-select" aria-label="单元"><option value="">单元</option></select>
        <button id="p-prev-page-btn" class="icon-btn" title="上一页" style="color:#f8fafc; background:#1e293b; border-color:#334155;">←</button>
        <span id="p-page-label" style="font-size: 13px; min-width: 55px; text-align: center; color: var(--accent); font-weight: 700;">P. 9</span>
        <button id="p-next-page-btn" class="icon-btn" title="下一页" style="color:#f8fafc; background:#1e293b; border-color:#334155;">→</button>
      </div>
    </header>

    <!-- 上下栏主体 -->
    <div class="portrait-body" id="portrait-body">
      <!-- 上栏：教材大图与 16:9 原声视频全宽舞台 -->
      <section class="pdf-top-panel" id="pdf-panel">
        <!-- 模式 A: 普通 PDF 教材视图 -->
        <div id="p-pdf-stage" class="p-stage-content">
          <div class="pdf-floating-tools">
            <button class="tool-mini-btn" id="zoom-in-btn">放大 +</button>
            <button class="tool-mini-btn" id="zoom-out-btn">缩小 -</button>
            <button class="tool-mini-btn" id="zoom-reset-btn">自适应宽</button>
          </div>
          <div class="pdf-viewport-inner">
            <div id="p-pdf-wrapper" class="portrait-page-wrapper">
              <img id="p-page-image" class="pdf-page-img" src="" alt="教材页面加载中...">
              <div id="p-highlight-layer" class="pdf-highlight-layer"></div>
            </div>
          </div>
        </div>

        <!-- 模式 B: 原声视频剧场展台 (YouTube & 视频课程，16:9 宽屏高清置顶展示) -->
        <div id="p-video-stage" class="p-stage-content p-video-stage" style="display: none;">
          <div class="p-video-header">
            <div class="p-video-header-left">
              <span class="p-video-badge">🎬 视频原声原音</span>
              <span class="p-video-ts" id="p-video-ts">00:00 - 00:00</span>
              <span class="p-video-live-pill" id="p-video-live-pill">⚡ 同步连通</span>
            </div>
            <div class="p-video-header-right">
              <button id="p-video-play-btn" class="mini-icon-btn" style="padding: 2px 8px; font-size: 11px;" title="播放 / 暂停当前句视频片段 (快捷键: 空格 / Alt+V)">⏯️ 播放</button>
              <button id="p-video-replay-btn" class="mini-icon-btn" style="padding: 2px 8px; font-size: 11px;" title="重播当前句原声视频 (Alt+V / Alt+R)">🔁 重播片段</button>
              <button id="p-video-loop-btn" class="mini-icon-btn" style="padding: 2px 8px; font-size: 11px;" title="单句循环播放 开/关 (Alt+L)">🔂</button>
              <button id="p-video-autoplay-btn" class="mini-icon-btn active" style="padding: 2px 8px; font-size: 11px;" title="句子切换时自动播放视频片段 开/关">▶ 自动连播</button>
              <button id="p-video-mute-btn" class="mini-icon-btn" style="padding: 2px 8px; font-size: 11px;" title="静音 / 恢复音效">🔊</button>
            </div>
          </div>
          <div class="p-video-viewport" id="p-video-viewport">
            <div id="p-autoplay-unlock-banner" class="p-autoplay-unlock-banner" title="点击启用浏览器自动播放声音权限">▶ 点击此处启用竖屏音画自动连播</div>
            <video id="p-document-video-element" playsinline preload="metadata" controlsList="nodownload"></video>
          </div>
        </div>
      </section>

      <!-- 垂直上下拖拽分割条 -->
      <div class="resizer-v portrait-resizer-v" id="portrait-resizer-vertical" title="上下拖动调整教材视口与控制面板高度"></div>

      <!-- 下栏：逐句精讲、连续播放与控制 -->
      <section class="sentences-bottom-panel" id="sentences-bottom-panel">
        <!-- 竖屏功能视图切换：视听跟打兼顾 / 专注跟打 / 课文句子 / 智能板书 -->
        <div class="p-panel-tabs" id="p-panel-tabs">
          <button class="p-panel-tab-btn active" data-view="split" id="p-tab-split" title="上方跟打 + 下方句子列表">📑 视听跟打兼顾</button>
          <button class="p-panel-tab-btn" data-view="typing" id="p-tab-typing" title="专注大屏逐词跟打">⌨️ 专注跟打</button>
          <button class="p-panel-tab-btn" data-view="sentences" id="p-tab-sentences" title="完整整页句子列表导览">📖 课文与句子</button>
          <button class="p-panel-tab-btn" data-view="notes" id="p-tab-notes" title="查看AI实时智能板书笔记">📝 智能板书</button>
        </div>

        <!-- 控制工具栏 -->
        <div class="bottom-control-toolbar">
          <div class="toolbar-group">
            <button id="p-ctrl-prev" class="btn btn-quiet" style="padding: 6px 10px;" title="上一句">◀ 上一句</button>
            <span id="p-sent-progress" class="sent-progress-pill">第 1 / 0 句</span>
            <button id="p-ctrl-next" class="btn btn-quiet" style="padding: 6px 10px;" title="下一句">下一句 ▶</button>
          </div>

          <div class="toolbar-group">
            <button id="p-continuous-btn" class="btn btn-continuous" title="从当前句开始自动连续精讲整页所有句子">
              <span id="p-continuous-icon">▶️</span>
              <span id="p-continuous-text">连续自动精讲整页</span>
            </button>
          </div>

          <div class="toolbar-group">
            <button id="p-ctrl-explain" class="btn btn-primary" style="padding: 6px 12px;" title="对当前句进行双语深度精讲">📖 精讲</button>
            <button id="p-ctrl-read" class="btn btn-quiet" style="padding: 6px 12px;" title="播放原声朗读">🔊 纯读</button>
            <button id="p-ctrl-practice" class="btn btn-outline" style="padding: 6px 12px;" title="跟读练习">🎙️ 跟读</button>
            <button id="p-ctrl-typing" class="btn btn-outline" style="padding: 6px 12px;" title="切换竖屏逐词跟打面板">⌨️ 跟打</button>
            <button id="p-ctrl-notes" class="btn btn-outline" style="padding: 6px 12px;" title="切换竖屏智能板书面板">📝 板书</button>
          </div>

          <div class="toolbar-group">
            <span class="p-mode-badge" id="p-mode-badge" title="当前教学风格（由横屏主台切换）">🗣️ 口语大师</span>
          </div>
        </div>

        <!-- 当前句聚焦特写与中文对照 (大字号、沉浸阅读) -->
        <div class="current-focus-card" id="p-focus-card">
          <div class="focus-card-meta">
            <div style="display: flex; align-items: center; gap: 8px;">
              <span class="focus-badge" id="p-focus-badge">当前聚焦: 第 1 句</span>
              <span class="focus-status-text" id="p-focus-status">就绪 · 点击上方按钮开始</span>
            </div>
            <div style="display: flex; align-items: center; gap: 6px;">
              <button id="p-focus-trans-toggle" class="btn btn-quiet" style="padding: 2px 8px; font-size: 11px; height: 24px;" title="显示/隐藏中文释义">🇨🇳 译文</button>
            </div>
          </div>
          <div class="focus-sentence-text" id="p-focus-text">正在提取教材句子...</div>
          <!-- 中文释义呈现区 -->
          <div class="focus-translation-box" id="p-focus-trans-box">
            <span class="translation-prefix">🇨🇳 释义</span>
            <span class="translation-text" id="p-focus-trans-text">载入教材后显示中文释义</span>
          </div>
        </div>

        <!-- 竖屏逐词跟打练习区 (当打字区域移至竖屏时呈现) -->
        <div class="shadow-typing-card" id="p-shadow-typing-card" style="display: none;">
          <div class="typing-card-header" id="p-typing-card-header">
            <div class="typing-header-left">
              <span class="typing-card-title">⌨️ 逐词跟打练习</span>
              <span class="typing-status-pill" id="p-typing-status-pill">待打字</span>
              <button id="p-undock-btn" class="dock-toggle-btn" title="将跟打练习区移回横屏主台">🖥️ 移回横屏</button>
            </div>
            <div class="typing-metrics-bar">
              <span class="typing-combo-badge" id="p-typing-combo-badge">Combo x0 🔥</span>
              <span class="typing-wpm-badge" id="p-typing-wpm-badge">0 WPM</span>
              <div class="typing-odometer-pill" id="p-typing-odometer-pill" title="打字总里程表：统计敲击过的每个单词">
                <span class="typing-odometer-icon">🚗</span>
                <span class="typing-odometer-label">总里程</span>
                <span class="typing-odometer-val" id="p-typing-odometer-val">0</span>
                <span class="typing-odometer-unit">词</span>
              </div>
            </div>
          </div>

          <div class="typing-target-display" id="p-typing-target-display" tabindex="0" title="竖屏跟打练习区 (点击直接开始敲击键盘跟打)">
            <span class="char-pending">载入教材后开始跟打练习</span>
          </div>

          <div class="typing-hint-bar">
            <span id="p-typing-progress-text">进度: 0 / 0 字符</span>

            <div class="typing-nav-group">
              <div class="studio-page-badge" id="p-studio-page-badge" title="当前页码">
                <button id="p-studio-prev-page-btn" class="nav-mini-btn" title="上一页">←</button>
                <span id="p-studio-page-num" class="nav-page-num">P. 1</span>
                <button id="p-studio-next-page-btn" class="nav-mini-btn" title="下一页">→</button>
              </div>
              <div class="sentence-stepper" id="p-sentence-stepper-box" title="当前页句子导航">
                <button id="p-sent-prev-btn" class="nav-mini-btn" title="上一句">◀</button>
                <span id="p-sent-progress-label" class="nav-sent-label">第 1 / 0 句</span>
                <button id="p-sent-next-btn" class="nav-mini-btn" title="下一句">▶</button>
              </div>
            </div>

            <div class="typing-actions-group">
              <button id="p-typing-repeat-btn" class="mini-icon-btn repeat-mode-btn" title="单句跟打遍数模式 (点击切换 1/2/3 遍)">
                <span id="p-typing-repeat-label">1遍</span>
              </button>
              <button id="p-typing-word-sound-btn" class="mini-icon-btn active" title="单词发音开关">🔤</button>
              <button id="p-typing-word-trans-btn" class="mini-icon-btn active" title="单词中文释义"><span class="btn-text-badge">中</span></button>
              <button id="p-typing-sound-btn" class="mini-icon-btn" title="敲击音效开关">🔊</button>
              <button id="p-typing-replay-btn" class="mini-icon-btn" title="重听原句发音">🔁</button>
              <button id="p-typing-loop-btn" class="mini-icon-btn" title="单句循环播放">🔂</button>
              <button id="p-typing-clear-btn" class="mini-icon-btn" title="清空重打">↺</button>
              <label class="auto-typing-toggle-label" title="句子切换时自动聚焦打字框">
                <input type="checkbox" id="p-auto-typing-toggle" checked> 自动聚焦
              </label>
            </div>
          </div>
        </div>

        <!-- 句子列表 (全页句子清晰导览，高亮跟随) -->
        <div class="sentences-scroll-area" id="p-sentences-container">
          <div class="empty-prompt">载入教材中...</div>
        </div>

        <!-- 竖屏智能板书笔记展示区 (当板书停靠至竖屏时呈现) -->
        <div class="p-notes-container" id="p-notes-container" style="display: none;">
          <div class="p-notes-header">
            <div class="p-notes-title-group">
              <span class="p-notes-title">📝 实时智能板书</span>
              <span class="p-notes-status-badge" id="p-notes-status-badge">同步就绪</span>
            </div>
            <div class="p-notes-actions">
              <button id="p-notes-gen-btn" class="btn btn-quiet" style="padding: 2px 8px; font-size: 11px; color: var(--accent); font-weight: 600;" title="使用云端AI极速生成当前句智能板书 (树状句法·重点生词精讲)">⚡ 生成板书</button>
              <button id="p-notes-fs-btn" class="btn btn-quiet" style="padding: 2px 8px; font-size: 11px;" title="全屏查看智能板书 (快捷键: F10)">⛶ 全屏</button>
              <button id="p-notes-copy-btn" class="btn btn-quiet" style="padding: 2px 8px; font-size: 11px;" title="复制当前板书笔记">📋 复制</button>
              <button id="p-notes-undock-btn" class="dock-toggle-btn" style="padding: 2px 8px; font-size: 11px;" title="将智能板书移回横屏主台">🖥️ 移回横屏</button>
            </div>
          </div>
          <div class="p-notes-content" id="p-notes-content">
            <div class="empty-prompt">等待导师讲解生成板书笔记…</div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script>
    const syncChannel = new BroadcastChannel("english_coach_sync");
    let currentDocId = "vocabulary";
    let currentPage = 9; // Default to Unit 1 rather than empty cover
    let currentSentences = [];
    let activeSentenceIndex = 1;
    let isContinuousActive = false;
    let currentZoom = 1.0;
    // Translation cache & focus state
    const portraitTranslations = {};
    let currentFocusTextCleaned = "";

    function isValidChineseTranslation(sourceText, trans) {
      if (!trans || typeof trans !== "string") return false;
      const t = trans.trim();
      const s = (sourceText || "").trim();
      if (!t || !s) return false;
      if (t.toLowerCase() === s.toLowerCase()) return false;
      const hasLetters = /[a-zA-Z]{2,}/.test(s);
      const hasChinese = /[\u4e00-\u9fa5]/.test(t);
      if (hasLetters && !hasChinese) return false;
      return true;
    }

    function escapeHtml(text) {
      if (text === null || text === undefined) return "";
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // Progress Persistence Manager
    const PROGRESS_STORAGE_KEY = "english_coach_learning_progress";
    let learningProgress = null;
    try {
      const cached = localStorage.getItem(PROGRESS_STORAGE_KEY);
      if (cached) {
        learningProgress = JSON.parse(cached);
        if (learningProgress.last_document_id) {
          currentDocId = learningProgress.last_document_id;
        }
      }
    } catch (_) {}

    async function fetchLearningProgress() {
      try {
        const res = await fetch("/api/progress");
        if (res.ok) {
          learningProgress = await res.json();
          try { localStorage.setItem(PROGRESS_STORAGE_KEY, JSON.stringify(learningProgress)); } catch (_) {}
        }
      } catch (e) {
        console.warn("Portrait: failed to fetch progress:", e);
      }
      return learningProgress;
    }

    function savePortraitProgress(updates) {
      if (!updates) return;
      if (!learningProgress) learningProgress = {};
      Object.assign(learningProgress, updates);
      if (!learningProgress.books) learningProgress.books = {};
      if (updates.document_id) {
        const prevBook = learningProgress.books[updates.document_id] || {};
        learningProgress.books[updates.document_id] = {
          last_page: updates.page ?? (prevBook.last_page || 1),
          last_sentence_index: updates.sentence_index ?? (prevBook.last_sentence_index || 1),
          updated_at: new Date().toISOString()
        };
      }
      try { localStorage.setItem(PROGRESS_STORAGE_KEY, JSON.stringify(learningProgress)); } catch (_) {}
      try {
        fetch("/api/progress", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(updates),
        }).catch(() => {});
      } catch (_) {}
    }

    const docSelect = document.getElementById("p-doc-select");
    const unitSelect = document.getElementById("p-unit-select");
    const pageImg = document.getElementById("p-page-image");
    const pageLabel = document.getElementById("p-page-label");
    const sentContainer = document.getElementById("p-sentences-container");
    const sentProgress = document.getElementById("p-sent-progress");
    const focusBadge = document.getElementById("p-focus-badge");
    const focusStatus = document.getElementById("p-focus-status");
    const focusText = document.getElementById("p-focus-text");
    const continuousBtn = document.getElementById("p-continuous-btn");
    const continuousIcon = document.getElementById("p-continuous-icon");
    const continuousText = document.getElementById("p-continuous-text");
    const pFocusTransBox = document.getElementById("p-focus-trans-box");
    const pFocusTransText = document.getElementById("p-focus-trans-text");
    const pFocusTransToggle = document.getElementById("p-focus-trans-toggle");

    let currentPortraitActionMode = localStorage.getItem("ai_coach_action_mode") || "explain";
    let isPortraitVideoAutoplay = localStorage.getItem("ai_coach_portrait_autoplay") !== "false";
    let isPortraitLoopPlayback = false;
    let portraitLoopTimer = null;
    let hasPortraitInteracted = false;
    let isNotesFullscreen = false;
    let savedViewModeBeforeFs = null;
    let isLandscapeTypingFullscreen = false;

    window.addEventListener("pointerdown", () => {
      hasPortraitInteracted = true;
      const banner = document.getElementById("p-autoplay-unlock-banner");
      if (banner) banner.style.display = "none";
    }, { capture: true });

    // Listen to sync events from landscape master window
    syncChannel.onmessage = (event) => {
      const { type, data } = event.data || {};
      if (type === "page_updated") {
        if (data.document_id !== currentDocId || data.page !== currentPage) {
          const prevDocId = currentDocId;
          currentDocId = data.document_id;
          currentPage = data.page;
          const targetSent = data.sentence_index || 1;
          if (prevDocId !== currentDocId) {
            const hasOption = Array.from(docSelect.options).some(o => o.value === currentDocId);
            if (!hasOption) {
              initDocuments().then(() => loadUnits(targetSent));
            } else {
              docSelect.value = currentDocId;
              loadUnits(targetSent);
            }
          } else {
            loadPage(currentDocId, currentPage, false, targetSent);
          }
        }
      } else if (type === "sentence_change" || type === "sentence_selected") {
        if (data && data.sentence_index) {
          if (data.source === "portrait") return;
          selectSentence(data.sentence_index, true);
          if (data.auto_play && isPortraitVideoAutoplay) {
            playSentenceAudioDirect(data.sentence_index);
          }
        }
      } else if (type === "play" || type === "video_play_clip") {
        if (data && data.sentence_index) {
          if (typeof data.loop === "boolean") {
            isPortraitLoopPlayback = data.loop;
            const loopBtn = document.getElementById("p-video-loop-btn");
            if (loopBtn) loopBtn.classList.toggle("active", isPortraitLoopPlayback);
          }
          selectSentence(data.sentence_index, true);
          playSentenceAudioDirect(data.sentence_index);
        }
      } else if (type === "pause" || type === "video_pause") {
        const pVideoEl = document.getElementById("p-document-video-element");
        if (pVideoEl && !pVideoEl.paused) {
          try { pVideoEl.pause(); } catch (_) {}
        }
        if (pVideoCheckInterval) {
          clearInterval(pVideoCheckInterval);
          pVideoCheckInterval = null;
        }
        document.querySelectorAll(".inline-play-btn.playing, #p-video-replay-btn.playing").forEach(b => b.classList.remove("playing"));
        document.querySelectorAll(".sentence-card.speaking").forEach(c => c.classList.remove("speaking"));
        const playBtn = document.getElementById("p-video-play-btn");
        if (playBtn) playBtn.textContent = "⏯️ 播放";
      } else if (type === "seek") {
        const pVideoEl = document.getElementById("p-document-video-element");
        if (pVideoEl && data && typeof data.time === "number") {
          try {
            if (pVideoEl.readyState >= 1) pVideoEl.currentTime = data.time;
            else pVideoEl.addEventListener("loadedmetadata", () => { pVideoEl.currentTime = data.time; }, { once: true });
          } catch (_) {}
        }
      } else if (type === "video_mode") {
        if (data) {
          docHasMedia = !!data.has_media;
          docMediaUrl = data.media_url || (docHasMedia ? `/api/documents/${data.document_id || currentDocId}/media` : null);
          applyPortraitVideoModeUI(docHasMedia, docMediaUrl);
        }
      } else if (type === "loop_mode") {
        if (data && typeof data.loop === "boolean") {
          isPortraitLoopPlayback = data.loop;
          const loopBtn = document.getElementById("p-video-loop-btn");
          if (loopBtn) loopBtn.classList.toggle("active", isPortraitLoopPlayback);
        }
      } else if (type === "ping_portrait") {
        try { syncChannel.postMessage({ type: "portrait_connected" }); } catch (_) {}
      } else if (type === "continuous_progress") {
        updateContinuousState(data.running, data.sentence_index);
      } else if (type === "action_mode") {
        if (data && data.mode) {
          currentPortraitActionMode = data.mode;
        }
      } else if (type === "teaching_style") {
        if (data && data.style) {
          updatePortraitStyleBadge(data.style);
          savePortraitProgress({ teaching_style: data.style });
        }
      } else if (type === "pronunciation_eval") {
        if (data && data.score !== undefined) {
          focusStatus.textContent = `🎙️ 发音评测: ${data.score}分`;
        }
      } else if (type === "document_uploaded") {
        initDocuments(data && data.id, 1, 1);
      } else if (type === "theme_changed") {
        if (data && data.theme) {
          applyPortraitTheme(data.theme, false);
        }
      } else if (type === "game_status_updated") {
        if (data) {
          updatePortraitHud(data);
        }
      } else if (type === "sentence_translation") {
        // Landscape window fetched a translation — validate and cache it
        if (data && data.text && isValidChineseTranslation(data.text, data.translation)) {
          portraitTranslations[data.text] = data.translation;
          if (currentFocusTextCleaned === data.text && pFocusTransText) {
            pFocusTransText.textContent = data.translation;
          }
        }
      } else if (type === "typing_dock_change") {
        if (data && data.dock) {
          setPortraitTypingDock(data.dock, false);
        }
      } else if (type === "notes_dock_change") {
        if (data && data.dock) {
          setPortraitNotesDock(data.dock, false);
        }
      } else if (type === "notes_update") {
        if (data && data.notes !== undefined) {
          renderPortraitWhiteboard(data.notes);
        }
      } else if (type === "typing_sync") {
        if (data && data.source !== "portrait") {
          mirrorLandscapeTyping(data);
        }
      } else if (type === "odometer_updated") {
        if (data && data.total_words !== undefined) {
          PortraitOdometerEngine.totalWords = Number(data.total_words) || PortraitOdometerEngine.totalWords;
          PortraitOdometerEngine.updateDisplays();
        }
      } else if (type === "typing_fullscreen_change") {
        if (data && data.active !== undefined) {
          isLandscapeTypingFullscreen = !!data.active;
          setPortraitNotesFullscreen(isLandscapeTypingFullscreen);
        }
      }
    };

    // Keep landscape aware of portrait connection state
    setInterval(() => {
      try { syncChannel.postMessage({ type: "portrait_heartbeat" }); } catch (_) {}
    }, 4000);
    window.addEventListener("beforeunload", () => {
      try { syncChannel.postMessage({ type: "portrait_disconnected" }); } catch (_) {}
    });

    const styleLabels = {
      spoken: "🗣️ 口语大师",
      history: "🏛️ 文史精读",
      ielts: "🎓 雅思学术",
      grammar: "🧩 句法拆解",
      drill: "⚡ 刷题速成"
    };

    function updatePortraitStyleBadge(style) {
      const badge = document.getElementById("p-mode-badge");
      if (badge && style) {
        badge.textContent = styleLabels[style] || style;
      }
    }

    function updateContinuousState(running, activeIdx) {

      isContinuousActive = !!running;
      if (isContinuousActive) {
        continuousBtn.classList.add("active");
        continuousIcon.textContent = "⏸️";
        continuousText.textContent = "暂停连续讲解";
        focusStatus.textContent = "⚡ 正在连续自动精讲中...";
        if (activeIdx) selectSentence(activeIdx, false);
      } else {
        continuousBtn.classList.remove("active");
        continuousIcon.textContent = "▶️";
        continuousText.textContent = "连续自动精讲整页";
        focusStatus.textContent = "已就绪";
      }
    }

    async function initDocuments(targetDocId = null, targetPage = null, targetSentence = null) {
      try {
        await fetchLearningProgress();
        if (learningProgress) {
          if (learningProgress.teaching_style) {
            updatePortraitStyleBadge(learningProgress.teaching_style);
          }
          if (learningProgress.last_document_id) {
            currentDocId = learningProgress.last_document_id;
          }
        }
        if (targetDocId) {
          currentDocId = targetDocId;
        }

        const res = await fetch("/api/documents");
        const data = await res.json();
        const docs = data.documents || [];
        if (!docs.length) return;

        if (!docs.some(d => d.id === currentDocId)) {
          currentDocId = docs[0].id;
        }

        docSelect.innerHTML = docs.map(d => `<option value="${escapeHtml(d.id)}" ${d.id === currentDocId ? 'selected' : ''}>${escapeHtml(d.title)}</option>`).join("");
        docSelect.onchange = async () => {
          currentDocId = docSelect.value;
          if (currentDocId === "west_civ") {
            updatePortraitStyleBadge("history");
            try { syncChannel.postMessage({ type: "teaching_style", data: { style: "history" } }); } catch (_) {}
            savePortraitProgress({ teaching_style: "history" });
          }
          
          let targetPage = null;
          let targetSentence = null;
          if (learningProgress && learningProgress.books && learningProgress.books[currentDocId]) {
            targetPage = learningProgress.books[currentDocId].last_page;
            targetSentence = learningProgress.books[currentDocId].last_sentence_index;
          }
          if (!targetPage) {
            targetPage = currentDocId === "west_civ" ? 38 : (currentDocId === "vocabulary" || currentDocId === "grammar" ? 9 : 1);
          }
          if (!targetSentence) {
            targetSentence = 1;
          }
          currentPage = targetPage;
          await loadUnits(targetSentence);
        };

        let initialPage = targetPage;
        let initialSentence = targetSentence;
        if (!initialPage && learningProgress) {
          if (learningProgress.books && learningProgress.books[currentDocId]) {
            initialPage = learningProgress.books[currentDocId].last_page;
            initialSentence = learningProgress.books[currentDocId].last_sentence_index;
          } else if (learningProgress.last_document_id === currentDocId) {
            initialPage = learningProgress.last_page;
            initialSentence = learningProgress.last_sentence_index;
          }
        }
        if (!initialPage) {
          initialPage = currentDocId === "west_civ" ? 38 : (currentDocId === "vocabulary" || currentDocId === "grammar" ? 9 : 1);
        }
        if (!initialSentence) {
          initialSentence = 1;
        }
        currentPage = initialPage;
        await loadUnits(initialSentence);
      } catch (err) {
        console.error("Failed to init documents", err);
      }
    }

    async function loadUnits(targetSentence = null) {
      try {
        const res = await fetch(`/api/documents/${currentDocId}/units`);
        const data = await res.json();
        const units = data.units || [];
        unitSelect.innerHTML = `<option value="">选择单元</option>` + units.map(u => {
          const label = (u.title && (u.title.startsWith("Ch.") || u.title.startsWith("Chapter") || u.title.startsWith("Unit")))
            ? `${escapeHtml(u.title)}`
            : `Unit ${escapeHtml(String(u.unit))}: ${escapeHtml(u.title)} (P.${u.page})`;
          return `<option value="${u.page}">${label}</option>`;
        }).join("");
        
        unitSelect.onchange = () => {
          if (unitSelect.value) {
            currentPage = parseInt(unitSelect.value);
            loadPage(currentDocId, currentPage, true, 1);
          }
        };

        // If page is 1 (cover) and units exist in built-in textbooks, auto-advance to Unit 1 page!
        if (currentPage <= 1 && units.length > 0 && (currentDocId === "west_civ" || currentDocId === "vocabulary" || currentDocId === "grammar")) {
          currentPage = units[0].page;
        }
        const matchedUnit = [...units].reverse().find(u => u.page <= currentPage);
        if (matchedUnit) {
          unitSelect.value = matchedUnit.page;
        }

        await loadPage(currentDocId, currentPage, true, targetSentence);
      } catch (err) {
        console.error("Failed to load units", err);
      }
    }

    async function loadPage(docId, pageNum, broadcast = true, targetSentence = null) {
      currentDocId = docId;
      currentPage = pageNum;
      docSelect.value = docId;
      pageLabel.textContent = `P. ${pageNum}`;
      pageImg.src = `/api/documents/${docId}/pages/${pageNum}/image?t=${Date.now()}`;

      const targetSent = (targetSentence !== null && targetSentence !== undefined && targetSentence >= 1) ? targetSentence : 1;

      if (broadcast) {
        syncChannel.postMessage({
          type: "page_change_requested",
          data: {
            document_id: docId,
            page: pageNum,
            sentence_index: targetSent
          }
        });
      }

      savePortraitProgress({
        document_id: docId,
        page: pageNum,
        sentence_index: targetSent
      });

      // Fetch sentences
      try {
        const res = await fetch(`/api/documents/${docId}/pages/${pageNum}/sentences`);
        const data = await res.json();
        docHasMedia = !!data.has_media;
        docMediaUrl = data.media_url || (docHasMedia ? `/api/documents/${docId}/media` : null);
        applyPortraitVideoModeUI(docHasMedia, docMediaUrl);
        currentSentences = data.sentences || [];
        renderSentences(currentSentences);
        renderPortraitHighlights(currentSentences);
        if (currentSentences.length > 0) {
          const sentIdx = Math.max(1, Math.min(targetSent, currentSentences.length));
          selectSentence(sentIdx, false);
        }
      } catch (err) {
        console.error("Failed to fetch sentences", err);
      }
    }

    let docHasMedia = false;
    let docMediaUrl = null;
    let currentAudioPlayback = null;
    let currentAudioBtn = null;
    let pVideoCheckInterval = null;

    function applyPortraitVideoModeUI(hasMedia, mediaUrl) {
      docHasMedia = !!hasMedia;
      docMediaUrl = mediaUrl || (docHasMedia ? `/api/documents/${currentDocId}/media` : null);
      const pdfPanel = document.getElementById("pdf-panel");
      const pPdfStage = document.getElementById("p-pdf-stage");
      const pVideoStage = document.getElementById("p-video-stage");
      const pVideoEl = document.getElementById("p-document-video-element");

      if (docHasMedia && docMediaUrl) {
        if (pPdfStage) pPdfStage.style.display = "none";
        if (pVideoStage) pVideoStage.style.display = "flex";
        if (pdfPanel) {
          pdfPanel.classList.add("video-mode");
          const panelW = pdfPanel.clientWidth || window.innerWidth;
          const videoFitH = Math.round(panelW * 9 / 16) + 38;
          const maxAllowed = Math.round(window.innerHeight * 0.55);
          const idealH = Math.min(maxAllowed, videoFitH);
          const savedVideoH = parseInt(localStorage.getItem("ai_coach_portrait_video_h"), 10);
          pdfPanel.style.height = (savedVideoH || idealH) + "px";
        }
        if (pVideoEl && (!pVideoEl.src || !pVideoEl.src.includes(`/api/documents/${currentDocId}/media`))) {
          pVideoEl.src = docMediaUrl;
          pVideoEl.load();
        }
      } else {
        if (pPdfStage) pPdfStage.style.display = "flex";
        if (pVideoStage) pVideoStage.style.display = "none";
        if (pdfPanel) {
          pdfPanel.classList.remove("video-mode");
          const savedPdfH = parseInt(localStorage.getItem("ai_coach_portrait_pdf_h") || localStorage.getItem("ai_coach_portrait_top_h"), 10);
          if (savedPdfH) pdfPanel.style.height = savedPdfH + "px";
          else pdfPanel.style.height = "";
        }
        if (pVideoEl) {
          if (!pVideoEl.paused) {
            try { pVideoEl.pause(); } catch (_) {}
          }
          pVideoEl.removeAttribute("src");
          pVideoEl.load();
        }
      }
    }

    function playSentenceAudioDirect(index, btnEl) {
      const sentenceObj = currentSentences.find(s => s.index === index);
      if (!sentenceObj || !sentenceObj.text) return;
      const text = sentenceObj.text.trim();
      if (!text) return;

      selectSentence(index, false);

      // Stop previous audio and video
      if (currentAudioPlayback) {
        try {
          currentAudioPlayback.onended = null;
          currentAudioPlayback.onerror = null;
          currentAudioPlayback._cancelled = true;
          currentAudioPlayback.pause();
          currentAudioPlayback.src = "";
        } catch (_) {}
        currentAudioPlayback = null;
      }
      if (portraitLoopTimer) {
        clearTimeout(portraitLoopTimer);
        portraitLoopTimer = null;
      }
      if (pVideoCheckInterval) {
        clearInterval(pVideoCheckInterval);
        pVideoCheckInterval = null;
      }
      const pVideoEl = document.getElementById("p-document-video-element");
      if (pVideoEl && !pVideoEl.paused) {
        try { pVideoEl.pause(); } catch (_) {}
      }
      if (currentAudioBtn) {
        currentAudioBtn.classList.remove("playing");
        currentAudioBtn = null;
      }

      // Sync visual state across all play buttons for this sentence index
      const matchingBtns = document.querySelectorAll(`.inline-play-btn[data-index="${index}"], #p-video-replay-btn`);
      matchingBtns.forEach(b => b.classList.add("playing"));
      if (btnEl) {
        btnEl.classList.add("playing");
        currentAudioBtn = btnEl;
      }

      // If document has media and sentence has timestamps, play authentic video/audio segment
      if (docHasMedia && pVideoEl && typeof sentenceObj.start_time === "number" && typeof sentenceObj.end_time === "number" && sentenceObj.end_time > sentenceObj.start_time) {
        focusStatus.textContent = "正在播放原声原音...";
        const startTime = Math.max(0, sentenceObj.start_time);
        const endTime = Math.max(startTime + 0.1, sentenceObj.end_time);
        const playBtn = document.getElementById("p-video-play-btn");

        const finishMediaPlay = (didEndClip = true) => {
          if (pVideoCheckInterval) {
            clearInterval(pVideoCheckInterval);
            pVideoCheckInterval = null;
          }
          matchingBtns.forEach(b => b.classList.remove("playing"));
          if (btnEl) btnEl.classList.remove("playing");
          if (currentAudioBtn === btnEl) currentAudioBtn = null;
          const sentCard = document.getElementById(`sent-card-${index}`);
          if (sentCard) sentCard.classList.remove("speaking");
          if (playBtn) playBtn.textContent = "⏯️ 播放";

          if (focusStatus && focusStatus.textContent === "正在播放原声原音...") {
            focusStatus.textContent = "原音播放完成";
          }
          try {
            syncChannel.postMessage({
              type: "video_status",
              data: { state: "paused", sentence_index: index, ended: didEndClip }
            });
            syncChannel.postMessage({
              type: "pause",
              data: { sentence_index: index, ended: didEndClip }
            });
          } catch (_) {}

          if (didEndClip && isPortraitLoopPlayback) {
            if (portraitLoopTimer) clearTimeout(portraitLoopTimer);
            portraitLoopTimer = setTimeout(() => {
              if (isPortraitLoopPlayback && activeSentenceIndex === index) {
                playSentenceAudioDirect(index, btnEl);
              }
            }, 650);
          }
        };

        const startVideoPlay = () => {
          pVideoEl.play().then(() => {
            const sentCard = document.getElementById(`sent-card-${index}`);
            if (sentCard) sentCard.classList.add("speaking");
            if (playBtn) playBtn.textContent = "⏸️ 暂停";
            try {
              syncChannel.postMessage({
                type: "video_status",
                data: { state: "playing", sentence_index: index }
              });
              syncChannel.postMessage({
                type: "play",
                data: { sentence_index: index, start_time: startTime, end_time: endTime }
              });
            } catch (_) {}
            if (pVideoCheckInterval) clearInterval(pVideoCheckInterval);
            pVideoCheckInterval = setInterval(() => {
              if (pVideoEl.seeking) return;
              if (pVideoEl.currentTime < startTime - 0.5) return;
              if (pVideoEl.currentTime >= endTime || pVideoEl.ended) {
                pVideoEl.pause();
                finishMediaPlay(true);
              }
            }, 35);
          }).catch(err => {
            console.warn("Original media play failed in portrait, falling back to TTS:", err);
            finishMediaPlay(false);
            if (err && err.name === "NotAllowedError") {
              const banner = document.getElementById("p-autoplay-unlock-banner");
              if (banner) banner.style.display = "block";
            } else {
              playTtsFallback();
            }
          });
        };

        const seekAndStart = () => {
          if (Math.abs(pVideoEl.currentTime - startTime) > 0.15) {
            let seekHandled = false;
            let timeoutId = setTimeout(() => {
              if (!seekHandled) {
                seekHandled = true;
                startVideoPlay();
              }
            }, 600);
            const onSeeked = () => {
              if (!seekHandled) {
                seekHandled = true;
                clearTimeout(timeoutId);
                pVideoEl.removeEventListener("seeked", onSeeked);
                startVideoPlay();
              }
            };
            pVideoEl.addEventListener("seeked", onSeeked, { once: true });
            try {
              pVideoEl.currentTime = startTime;
            } catch (err) {
              if (!seekHandled) {
                seekHandled = true;
                clearTimeout(timeoutId);
                pVideoEl.removeEventListener("seeked", onSeeked);
                startVideoPlay();
              }
            }
          } else {
            startVideoPlay();
          }
        };

        if (pVideoEl.readyState >= 1) {
          seekAndStart();
        } else {
          pVideoEl.addEventListener("loadedmetadata", seekAndStart, { once: true });
        }
        return;
      }

      playTtsFallback();

      function playTtsFallback() {
        focusStatus.textContent = "正在朗读原句...";
        let voice = "en-US-JennyNeural";
        const savedVoice = localStorage.getItem("ai_coach_voice");
        if (savedVoice && (savedVoice.startsWith("en-") || savedVoice.startsWith("zh-"))) {
          voice = savedVoice;
        }
        const speedVal = localStorage.getItem("ai_coach_speed") || "1.0";
        const audioUrl = `/api/tts?text=${encodeURIComponent(text)}&voice=${encodeURIComponent(voice)}&speed=${encodeURIComponent(speedVal)}`;
        const audio = new Audio(audioUrl);
        audio._cancelled = false;
        currentAudioPlayback = audio;

      const finishPlaying = () => {
        matchingBtns.forEach(b => b.classList.remove("playing"));
        if (btnEl) btnEl.classList.remove("playing");
        if (currentAudioBtn === btnEl) currentAudioBtn = null;
        if (currentAudioPlayback === audio) currentAudioPlayback = null;
        if (focusStatus && focusStatus.textContent === "正在朗读原句...") {
          focusStatus.textContent = "朗读完成";
        }
      };

      audio.onended = finishPlaying;
      audio.onerror = (err) => {
        if (audio._cancelled || !audio.src || audio.src === window.location.href) {
          finishPlaying();
          return;
        }
        console.warn("Direct TTS failed, falling back to Web Speech:", err);
        finishPlaying();
        if ('speechSynthesis' in window) {
          try {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'en-US';
            u.onend = finishPlaying;
            u.onerror = finishPlaying;
            matchingBtns.forEach(b => b.classList.add("playing"));
            window.speechSynthesis.speak(u);
          } catch (_) {
            finishPlaying();
          }
        }
      };

      audio.play().catch(err => {
        console.warn("Audio play blocked or interrupted:", err);
        finishPlaying();
      });
    }
  }

    function formatTs(sec) {
      if (sec === null || sec === undefined || isNaN(sec)) return "--:--";
      const s = Math.max(0, Math.floor(sec));
      const m = Math.floor(s / 60);
      const rem = s % 60;
      return `${String(m).padStart(2, '0')}:${String(rem).padStart(2, '0')}`;
    }

    function renderSentences(sentences) {

        return `
        <div class="sentence-card ${activeSentenceIndex === s.index ? 'active' : ''}" id="sent-card-${s.index}" onclick="handlePortraitCardClick(${s.index})">

            </div>
          </div>

            <button class="inline-play-btn ${hasMedia ? 'has-media-btn' : ''}" data-index="${s.index}" onclick="event.stopPropagation(); playSentenceAudioDirect(${s.index}, this)" title="${playBtnTitle}" aria-label="${playBtnTitle}">${inlinePlayLabel}</button>

    function renderPortraitHighlights(sentences) {

      if (!currentSentences || currentSentences.length === 0) return;

    function updateFocusTranslation(text, cachedTranslation = null) {
      if (!pFocusTransText) return;
      if (!text) {
        pFocusTransText.textContent = "载入教材后显示中文释义";
        return;
      }
      const cleaned = text.replace(/[\u00a0\u202f\u2009\u3000]/g, " ").replace(/\s+/g, " ").trim();
      currentFocusTextCleaned = cleaned;
      const validCached = isValidChineseTranslation(cleaned, cachedTranslation) ? cachedTranslation : null;
      if (validCached) {
        portraitTranslations[cleaned] = validCached;
      }
      if (isValidChineseTranslation(cleaned, portraitTranslations[cleaned])) {
        pFocusTransText.textContent = portraitTranslations[cleaned];
      } else {
        pFocusTransText.textContent = "正在获取中文释义...";
        fetchPortraitTranslation(cleaned);
      }
    }

    async function fetchPortraitTranslation(text) {
      if (!text) return "";
      const cleaned = text.replace(/[\u00a0\u202f\u2009\u3000]/g, " ").replace(/\s+/g, " ").trim();
      if (!cleaned) return "";
      if (isValidChineseTranslation(cleaned, portraitTranslations[cleaned])) {
        return portraitTranslations[cleaned];
      }

      try {
        const res = await fetch("/api/translate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: cleaned })
        });
        if (res.ok) {
          const data = await res.json();
          if (isValidChineseTranslation(cleaned, data.translation)) {
            portraitTranslations[cleaned] = data.translation;
            if (currentFocusTextCleaned === cleaned && pFocusTransText) {
              pFocusTransText.textContent = data.translation;
            }
            try { syncChannel.postMessage({ type: "sentence_translation", data: { text: cleaned, translation: data.translation } }); } catch (_) {}
            return data.translation;
          }
        }
      } catch (err) {
        console.warn("Portrait translation fetch failed:", err);
      }

      if (currentFocusTextCleaned === cleaned && pFocusTransText) {
        pFocusTransText.textContent = "暂无中文释义";
      }
      return "";
    }

    // Vertical Split Resizer for Portrait
    function initPortraitResizer() {
      const pdfPanel = document.getElementById("pdf-panel");
      const resizer = document.getElementById("portrait-resizer-vertical");
      const body = document.querySelector(".portrait-body");
      if (!pdfPanel || !resizer || !body) return;

      if (docHasMedia) {
        const savedVideoH = parseInt(localStorage.getItem("ai_coach_portrait_video_h"), 10);
        if (savedVideoH && savedVideoH >= 120 && savedVideoH <= window.innerHeight - 180) {
          pdfPanel.style.height = savedVideoH + "px";
        }
      } else {
        const savedTopH = parseInt(localStorage.getItem("ai_coach_portrait_pdf_h") || localStorage.getItem("ai_coach_portrait_top_h"), 10);
        if (savedTopH && savedTopH >= 120 && savedTopH <= window.innerHeight - 180) {
          pdfPanel.style.height = savedTopH + "px";
        }
      }

      let isDragging = false;
      resizer.addEventListener("pointerdown", (e) => {
        isDragging = true;
        resizer.classList.add("active");
        document.body.classList.add("is-resizing", "is-resizing-v");
        resizer.setPointerCapture(e.pointerId);
        e.preventDefault();
      });

      resizer.addEventListener("pointermove", (e) => {
        if (!isDragging) return;
        const bodyRect = body.getBoundingClientRect();
        let newH = e.clientY - bodyRect.top;
        const maxH = bodyRect.height - 160;
        newH = Math.max(120, Math.min(newH, maxH));
        pdfPanel.style.height = newH + "px";
      });

      const finish = (e) => {
        if (!isDragging) return;
        isDragging = false;
        resizer.classList.remove("active");
        document.body.classList.remove("is-resizing", "is-resizing-v");
        try { resizer.releasePointerCapture(e.pointerId); } catch (_) {}
        const h = parseInt(pdfPanel.style.height, 10);
        if (h) {
          if (docHasMedia) {
            localStorage.setItem("ai_coach_portrait_video_h", h);
          } else {
            localStorage.setItem("ai_coach_portrait_pdf_h", h);
            localStorage.setItem("ai_coach_portrait_top_h", h);
          }

      resizer.addEventListener("pointerup", finish);

    function renderMarkdownSafe(mdText) {
      if (!mdText) return "";
      if (typeof marked !== "undefined" && marked.parse) {
        try {
          const template = document.createElement("template");
          template.innerHTML = marked.parse(mdText);
          template.content
            .querySelectorAll("script, iframe, object, embed, style, link, meta, base, form, img, video, audio, source, svg, math")
            .forEach(node => node.remove());
          template.content.querySelectorAll("*").forEach(node => {
            [...node.attributes].forEach(attr => {
              const name = attr.name.toLowerCase();
              const value = attr.value.trim().toLowerCase();
              if (name.startsWith("on") || name === "srcdoc" ||
                  ((name === "href" || name === "src") && /^(javascript:|data:|vbscript:)/.test(value))) {
                node.removeAttribute(attr.name);
              }
            });
          });
          const wrapper = document.createElement("div");
          wrapper.appendChild(template.content);
          return wrapper.innerHTML;
        } catch (_) {
          return escapeHtml(mdText);
        }
      }
      return escapeHtml(mdText);
    }

    async function fetchPortraitSmartNotes(forceRefresh = false) {
      if (!currentSentences || !activeSentenceIndex) return;
      const targetSent = currentSentences.find(s => s.index === activeSentenceIndex);
      if (!targetSent || !targetSent.text) return;

      const cleanedText = (targetSent.text || "").replace(/[\u00a0\u202f\u2009\u3000]/g, " ").replace(/\s+/g, " ").trim();
      if (!cleanedText) return;

      if (!forceRefresh && portraitNotesCache[cleanedText]) {
        renderPortraitWhiteboard(portraitNotesCache[cleanedText]);
        return;
      }

      if (isPortraitNotesLoading && !forceRefresh) return;
      isPortraitNotesLoading = true;

      const contentEl = document.getElementById("p-notes-content");
      const genBtn = document.getElementById("p-notes-gen-btn");
      const badge = document.getElementById("p-notes-status-badge");

            sentence: cleanedText,

          })

        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const data = await resp.json();
        if (data.success && data.notes_markdown) {
          portraitNotesCache[cleanedText] = data.notes_markdown;
          renderPortraitWhiteboard(data.notes_markdown);
          try {
            syncChannel.postMessage({
              type: "notes_update",

            <div class="empty-prompt" style="padding: 24px 16px;">

              <button class="btn btn-xs btn-outline" id="retry-portrait-notes-btn">重试生成</button>
            </div>
          `;
          const retryBtn = document.getElementById("retry-portrait-notes-btn");

        if (badge && !isNotesFullscreen) {

    const PortraitSoundEngine = {
      ctx: null,

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;

          gain.gain.setValueAtTime(0.05, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.02);
          osc.connect(gain);

          osc.type = "sawtooth";

          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);

        if (!this.enabled) return;

          const now = this.ctx.currentTime;
          const notes = [523.25, 659.25, 783.99, 1046.50];
          notes.forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = "sine";
            const noteTime = now + (idx * 0.07);
            osc.frequency.setValueAtTime(freq, noteTime);
            gain.gain.setValueAtTime(0.1, noteTime);
            gain.gain.exponentialRampToValueAtTime(0.001, noteTime + 0.3);
            osc.connect(gain);
            gain.connect(this.ctx.destination);

    // Odometer Engine for Portrait Screen
    const PortraitOdometerEngine = {
      totalWords: 0,
      todayWords: 0,
      uniqueWords: 0,
      pendingWords: [],
      flushTimer: null,
      recordWord(cleanWord) {
        if (!cleanWord || typeof cleanWord !== "string") return;
        const trimmed = cleanWord.trim();
        if (!trimmed) return;
        this.totalWords++;
        this.todayWords++;
        this.updateDisplays();
        this.pendingWords.push({ word: trimmed, docId: currentDocId, sentIdx: activeSentenceIndex });
        if (this.pendingWords.length >= 5) {
          this.flush();
        } else {
          if (this.flushTimer) clearTimeout(this.flushTimer);
          this.flushTimer = setTimeout(() => this.flush(), 800);
        }
      },
      updateDisplays() {
        const valEl = document.getElementById("p-typing-odometer-val");
        if (valEl) valEl.textContent = this.totalWords.toLocaleString("en-US");
      },
      async flush() {
        if (this.flushTimer) {
          clearTimeout(this.flushTimer);
          this.flushTimer = null;
        }
        if (this.pendingWords.length === 0) return;
        const batch = [...this.pendingWords];
        this.pendingWords = [];
        try {
          const wordsList = batch.map(b => b.word);
          const res = await fetch("/api/game/odometer/record", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
