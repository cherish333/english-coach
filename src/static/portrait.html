              words: wordsList,
              document_id: currentDocId,
              sentence_index: activeSentenceIndex
            })
          });
          if (res.ok) {
            const data = await res.json();
            if (data && data.total_words !== undefined) {
              this.totalWords = Math.max(this.totalWords, data.total_words);
              if (data.today_words !== undefined) this.todayWords = Math.max(this.todayWords, data.today_words);
              if (data.unique_words !== undefined) this.uniqueWords = data.unique_words;
              this.updateDisplays();
              try {
                syncChannel.postMessage({
                  type: "odometer_updated",
                  data: {
                    total_words: this.totalWords,
                    today_words: this.todayWords,
                    unique_words: this.uniqueWords
                  }
                });
              } catch (_) {}
            }
          }
        } catch (_) {}
      }
    };

    function normalizeTypingChar(ch) {
      if (!ch) return "";
      if (ch === "’" || ch === "‘" || ch === "‛" || ch === "′" || ch === "`") return "'";
      if (ch === "“" || ch === "”" || ch === "‟" || ch === "″") return '"';
      if (ch === "–" || ch === "—" || ch === "−" || ch === "‒") return "-";
      if (ch === "\u00a0" || ch === "\u202f" || ch === "\u2009" || ch === "\u3000") return " ";
      if (ch === "…") return ".";
      return ch;
    }

    function areTypingCharsEqual(a, b) {
      if (a === b) return true;
      return normalizeTypingChar(a) === normalizeTypingChar(b);
    }

    function parseSentenceWords(sentence) {
      if (!sentence) return [];
      const words = [];
      const regex = /[a-zA-Z0-9]+(?:['’\-][a-zA-Z0-9]+)*/g;
      let match;
      while ((match = regex.exec(sentence)) !== null) {
        const rawWord = match[0];
        const startIndex = match.index;
        const endIndex = startIndex + rawWord.length;
        const cleanWord = rawWord.replace(/[’‘]/g, "'").trim();
        if (cleanWord.length > 0) {
          words.push({ raw: rawWord, clean: cleanWord, startIndex, endIndex });
        }
      }
      return words;
    }

    function playPortraitWordAudio(cleanWord) {
      if (!pIsWordAudioEnabled || !cleanWord) return;
      const url = `/api/tts?text=${encodeURIComponent(cleanWord)}&voice=en-US-JennyNeural&speed=1.0`;
      pWordAudioEl.src = url;
      pWordAudioEl.play().catch(() => {});
    }

    function scrollPortraitTypingTargetToActiveChar() {
      const display = document.getElementById("p-typing-target-display");
      if (!display) return;
      if (display.clientHeight <= 0 || display.scrollHeight <= display.clientHeight) return;
      const activeSpan = display.querySelector(".char-current") || display.querySelector("span[data-idx]:last-child");
      if (!activeSpan) return;

      const displayRect = display.getBoundingClientRect();
      const spanRect = activeSpan.getBoundingClientRect();
      const currentScrollTop = display.scrollTop;
      const visibleHeight = display.clientHeight;

      const spanContentTop = (spanRect.top - displayRect.top) + currentScrollTop;
      const spanContentBottom = (spanRect.bottom - displayRect.top) + currentScrollTop;
      const spanHeight = spanRect.height || 32;
      const bottomPadding = Math.min(visibleHeight * 0.45, Math.max(spanHeight * 1.25, 40));
      const topPadding = Math.min(visibleHeight * 0.25, Math.max(spanHeight * 0.5, 18));

      let targetScrollTop = currentScrollTop;
      if (spanContentBottom > currentScrollTop + visibleHeight - bottomPadding) {
        targetScrollTop = spanContentBottom - visibleHeight + bottomPadding;
      } else if (spanContentTop < currentScrollTop + topPadding) {
        targetScrollTop = spanContentTop - topPadding;
      }
      targetScrollTop = Math.max(0, Math.min(targetScrollTop, display.scrollHeight - visibleHeight));
      if (Math.abs(targetScrollTop - currentScrollTop) > 3) {
        display.scrollTo({ top: targetScrollTop, behavior: "smooth" });
      }
    }

      display.innerHTML = pCurrentTypingTarget
        .split("")

        .join("");

    function handlePortraitTypingInput() {

      const comboBadge = document.getElementById("p-typing-combo-badge");
      const wpmBadge = document.getElementById("p-typing-wpm-badge");
      if (!display || !pCurrentTypingTarget) return;

      if (!pTypingStartTime && typed.length > 0) {
        pTypingStartTime = Date.now();
      }

      const spans = display.querySelectorAll("span[data-idx]");
      let correctCount = 0;
      let hasError = false;

      for (let i = 0; i < spans.length; i++) {
        const span = spans[i];
        const targetChar = pCurrentTypingTarget[i];
        if (i < typed.length) {
          if (areTypingCharsEqual(typed[i], targetChar)) {
            span.className = "char-correct";
            correctCount++;
          } else {
            span.className = "char-wrong";
            hasError = true;
          }
        } else if (i === typed.length) {
          span.className = "char-current";
        } else {
          span.className = "char-pending";
        }
      }

      scrollPortraitTypingTargetToActiveChar();

      // Hit audio & combo
      if (typed.length > pLastTypedLength) {
        const charIndex = typed.length - 1;
        if (pIsWordAudioEnabled && pCurrentSentenceWords.length > 0) {
          const wordIdx = pCurrentSentenceWords.findIndex(w => charIndex >= w.startIndex && charIndex < w.endIndex);
          if (wordIdx !== -1 && wordIdx !== pLastSpokenWordIdx) {
            pLastSpokenWordIdx = wordIdx;
            playPortraitWordAudio(pCurrentSentenceWords[wordIdx].clean);
          }
        }

        if (charIndex < pCurrentTypingTarget.length && areTypingCharsEqual(typed[charIndex], pCurrentTypingTarget[charIndex])) {
          pCombo++;
          if (pCombo > pMaxCombo) pMaxCombo = pCombo;
          PortraitSoundEngine.playKeyClick();
        } else {
          pCombo = 0;
          PortraitSoundEngine.playErrorThud();
        }
      }
      pLastTypedLength = typed.length;

      // Track completed words for Odometer
      if (pCurrentSentenceWords.length > 0) {
        for (let i = 0; i < pCurrentSentenceWords.length; i++) {
          if (!pCompletedWords.has(i)) {
            const w = pCurrentSentenceWords[i];
            if (typed.length >= w.endIndex) {
              let allCorrect = true;
              for (let k = w.startIndex; k < w.endIndex; k++) {
                if (!areTypingCharsEqual(typed[k], pCurrentTypingTarget[k])) {
                  allCorrect = false;
                  break;
                }
              }
              if (allCorrect) {
                pCompletedWords.add(i);
                PortraitOdometerEngine.recordWord(w.clean);
              }
            }
          }
        }
      }

      // Combo badge
      if (comboBadge) {
        comboBadge.textContent = `Combo x${pCombo} 🔥`;
        if (pCombo >= 10) comboBadge.className = "typing-combo-badge super";
        else if (pCombo >= 3) comboBadge.className = "typing-combo-badge active";
        else comboBadge.className = "typing-combo-badge";
      }

      // WPM
      let wpm = 0;
      if (pTypingStartTime && typed.length > 0) {
        const elapsedSec = (Date.now() - pTypingStartTime) / 1000;
        if (elapsedSec > 0.6) {
          const words = typed.length / 5;
          wpm = Math.round((words / elapsedSec) * 60);
          if (wpmBadge) wpmBadge.textContent = `${wpm} WPM`;
        }
      }

      if (progressText) {
        progressText.textContent = pRepeatRounds > 1
          ? `进度: ${correctCount} / ${pCurrentTypingTarget.length} 字符 (第 ${pTypingRound}/${pRepeatRounds} 遍)`
          : `进度: ${correctCount} / ${pCurrentTypingTarget.length} 字符`;
      }

      if (hasError) {
        if (pill) { pill.className = "typing-status-pill"; pill.textContent = "存在拼写错误"; }
      } else if (typed.length > 0 && typed.length < pCurrentTypingTarget.length) {
        if (pill) {
          pill.className = "typing-status-pill active";
          pill.textContent = pRepeatRounds > 1
            ? `跟打中 (第 ${pTypingRound}/${pRepeatRounds} 遍)…`
            : `跟打中…`;
        }
      }

      // Broadcast sync to landscape
      try {
        syncChannel.postMessage({
          type: "typing_sync",
          data: {
            source: "portrait",
            sentence_index: activeSentenceIndex,
            target: pCurrentTypingTarget,
            typed: pTypedBuffer,
            combo: pCombo,
            wpm: wpm,
            completed: false,
            round: pTypingRound,
            repeatRounds: pRepeatRounds
          }
        });
      } catch (_) {}

      // Completion check
      const isMatch = (typed.length === pCurrentTypingTarget.length && !hasError);
      if (isMatch && !pIsTypingCompleted) {
        if (pTypingRound < pRepeatRounds) {
          PortraitSoundEngine.playSuccessChime();
          pTypingRound++;
          pTypedBuffer = "";
          pLastTypedLength = 0;
          pLastSpokenWordIdx = -1;
          pCompletedWords.clear();
          display.innerHTML = pCurrentTypingTarget
            .split("")
            .map((ch, idx) => `<span class="${idx === 0 ? 'char-current' : 'char-pending'}" data-idx="${idx}">${escapeHtml(ch)}</span>`)
            .join("");
          display.scrollTop = 0;
          if (pill) {
            pill.className = "typing-status-pill active";
            pill.textContent = `第 ${pTypingRound - 1} 遍完成，继续第 ${pTypingRound} 遍`;
          }
          if (progressText) {
            progressText.textContent = `进度: 0 / ${pCurrentTypingTarget.length} 字符 (第 ${pTypingRound}/${pRepeatRounds} 遍)`;
          }
          display.focus();
          return;
        }

        pIsTypingCompleted = true;
        if (pill) {
          pill.className = "typing-status-pill success";
          pill.textContent = pRepeatRounds > 1 ? `✓ 连续 ${pRepeatRounds} 遍跟打通关！` : "✓ 完美跟打达成！";
        }
        if (card) card.classList.add("completed");
        PortraitSoundEngine.playSuccessChime();
        if (pMaxCombo >= 8 || pRepeatRounds > 1) {
          PortraitConfettiEngine.fireConfetti();
        }
        PortraitOdometerEngine.flush();

        const wordCount = pCurrentTypingTarget.split(/\s+/).filter(Boolean).length;
        fetch("/api/game/action", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            action_type: "typing_completed",
            words_count: wordCount * pRepeatRounds,
            combo: pMaxCombo,
            increment_words: false
          })
        }).then(r => r.json()).then(data => {
          if (data && data.result) {
            updatePortraitHud(data.result.status);
          }
        }).catch(() => {});

        try {
          syncChannel.postMessage({
            type: "typing_completed",
            data: { sentence_index: activeSentenceIndex, rounds: pRepeatRounds }
          });
          syncChannel.postMessage({
            type: "typing_sync",
            data: {
              source: "portrait",
              sentence_index: activeSentenceIndex,
              target: pCurrentTypingTarget,
              typed: pTypedBuffer,
              combo: pCombo,
              wpm: wpm,
              completed: true,
              round: pTypingRound,
              repeatRounds: pRepeatRounds
            }
          });
        } catch (_) {}

        if (isContinuousActive) {
          setTimeout(() => {
            if (!isContinuousActive) return;
            if (currentSentences && activeSentenceIndex < currentSentences.length) {
              selectSentence(activeSentenceIndex + 1, true);
            }
          }, 1400);
        }
      }
    }

    function mirrorLandscapeTyping(data) {
      if (!data) return;
      const display = document.getElementById("p-typing-target-display");
      const comboBadge = document.getElementById("p-typing-combo-badge");
      const wpmBadge = document.getElementById("p-typing-wpm-badge");
      const pill = document.getElementById("p-typing-status-pill");

      if (comboBadge && data.combo !== undefined) {
        comboBadge.textContent = `Combo x${data.combo} 🔥`;
        comboBadge.className = data.combo >= 10 ? "typing-combo-badge super" : (data.combo >= 3 ? "typing-combo-badge active" : "typing-combo-badge");
      }
      if (wpmBadge && data.wpm !== undefined) {
        wpmBadge.textContent = `${data.wpm} WPM`;
      }
      if (display && data.target && data.typed !== undefined) {
        const target = data.target;
        const typed = data.typed;
        display.innerHTML = target.split("").map((ch, idx) => {
          let cls = "char-pending";
          if (idx < typed.length) {
            cls = areTypingCharsEqual(typed[idx], ch) ? "char-correct" : "char-wrong";
          } else if (idx === typed.length) {
            cls = "char-current";
          }
          return `<span class="${cls}" data-idx="${idx}">${escapeHtml(ch)}</span>`;
        }).join("");
      }
      if (data.completed) {
        const card = document.getElementById("p-shadow-typing-card");
        if (card) card.classList.add("completed");
        if (pill) { pill.className = "typing-status-pill success"; pill.textContent = "✓ 完美跟打达成！"; }
      }
    }

    function setPortraitTypingDock(dock, broadcast = true) {
      pTypingDock = dock;
      localStorage.setItem("english_coach_typing_dock", dock);
      const card = document.getElementById("p-shadow-typing-card");
      const navDockBtn = document.getElementById("p-typing-dock-btn");
      const ctrlTypingBtn = document.getElementById("p-ctrl-typing");

      const isPortrait = (dock === "portrait");
      if (card) {
        card.style.display = isPortrait ? "flex" : "none";
      }
      if (navDockBtn) {
        navDockBtn.textContent = isPortrait ? "⌨️ 竖屏跟打中 (移回)" : "⌨️ 竖屏跟打";
        navDockBtn.classList.toggle("active", isPortrait);
        navDockBtn.classList.toggle("btn-primary", isPortrait);
        navDockBtn.classList.toggle("btn-outline", !isPortrait);
      }
      if (ctrlTypingBtn) {
        ctrlTypingBtn.classList.toggle("active", isPortrait);
      }

      if (isPortrait) {
        const targetSent = currentSentences && currentSentences.find(s => s.index === activeSentenceIndex);
        if (targetSent) {
          setupPortraitShadowTyping(targetSent.text);
        }
      }

      if (broadcast) {
        try {
          syncChannel.postMessage({
            type: "typing_dock_change",
            data: { dock }
          });
        } catch (_) {}
      }
    }

    function setPortraitNotesDock(dock, broadcast = true) {
      pNotesDock = dock;
      localStorage.setItem("english_coach_notes_dock", dock);
      const notesContainer = document.getElementById("p-notes-container");
      const navNotesBtn = document.getElementById("p-notes-dock-btn");
      const ctrlNotesBtn = document.getElementById("p-ctrl-notes");

      const isPortrait = (dock === "portrait");
      if (navNotesBtn) {
        navNotesBtn.textContent = isPortrait ? "📝 竖屏板书中 (移回)" : "📝 竖屏板书";
        navNotesBtn.classList.toggle("active", isPortrait);
        navNotesBtn.classList.toggle("btn-primary", isPortrait);
        navNotesBtn.classList.toggle("btn-outline", !isPortrait);
      }
      if (ctrlNotesBtn) {
        ctrlNotesBtn.classList.toggle("active", isPortrait);
      }

      if (isPortrait) {
        setPortraitViewMode("notes");
      }

      if (broadcast) {
        try {
          syncChannel.postMessage({
            type: "notes_dock_change",
            data: { dock }
          });
        } catch (_) {}
      }
    }

    function setPortraitNotesFullscreen(active) {
      isNotesFullscreen = !!active;
      const body = document.getElementById("portrait-body") || document.querySelector(".portrait-body");
      const fsBtn = document.getElementById("p-notes-fs-btn");
      const badge = document.getElementById("p-notes-status-badge");

      if (body) {
        body.classList.toggle("notes-fullscreen-active", isNotesFullscreen);
      }
      document.body.classList.toggle("portrait-notes-fs", isNotesFullscreen);

      if (fsBtn) {
        fsBtn.textContent = isNotesFullscreen ? "✕ 退出全屏" : "⛶ 全屏";
        fsBtn.classList.toggle("active", isNotesFullscreen);
        fsBtn.title = isNotesFullscreen ? "退出全屏板书模式 (快捷键: Esc / F10)" : "全屏查看智能板书 (快捷键: F10)";
      }

      if (isNotesFullscreen) {
        if (pViewMode !== "notes") {
          savedViewModeBeforeFs = pViewMode;
          setPortraitViewMode("notes");
        }
        if (badge) {
          badge.textContent = isLandscapeTypingFullscreen ? "⚡ 主屏全屏跟打联动中" : "⛶ 全屏智能板书";
          badge.classList.add("active");
        }
      } else {
        if (savedViewModeBeforeFs) {
          setPortraitViewMode(savedViewModeBeforeFs);
          savedViewModeBeforeFs = null;
        }
        if (badge) {
          badge.textContent = "已实时同步";
          badge.classList.remove("active");
        }
      }
    }

    function setPortraitViewMode(mode) {
      pViewMode = mode;
      localStorage.setItem("english_coach_portrait_view", mode);
      const bottomPanel = document.getElementById("sentences-bottom-panel");
      const notesContainer = document.getElementById("p-notes-container");
      const sentencesContainer = document.getElementById("p-sentences-container");
      const typingCard = document.getElementById("p-shadow-typing-card");

      if (bottomPanel) {
        bottomPanel.classList.remove("view-split", "view-typing-only", "view-sentences-only", "view-notes-only");
        if (mode === "typing") bottomPanel.classList.add("view-typing-only");
        else if (mode === "sentences") bottomPanel.classList.add("view-sentences-only");
        else if (mode === "notes") bottomPanel.classList.add("view-notes-only");
        else bottomPanel.classList.add("view-split");
      }

      if (notesContainer) {
        notesContainer.style.display = (mode === "notes") ? "flex" : "none";
      }
      if (sentencesContainer) {
        sentencesContainer.style.display = (mode === "notes" || mode === "typing") ? "none" : "flex";
      }
      if (typingCard && pTypingDock === "portrait") {
        typingCard.style.display = (mode === "notes" || mode === "sentences") ? "none" : "flex";
      }

      document.querySelectorAll(".p-panel-tab-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.view === mode);
      });
    }

    function updatePortraitRepeatBtn() {
      const label = document.getElementById("p-typing-repeat-label");
      if (label) label.textContent = `${pRepeatRounds}遍`;
      localStorage.setItem("ai_coach_repeat_rounds", pRepeatRounds);
    }

    function initPortraitTyping() {
      const display = document.getElementById("p-typing-target-display");
      const navDockBtn = document.getElementById("p-typing-dock-btn");
      const undockBtn = document.getElementById("p-undock-btn");
      const ctrlTypingBtn = document.getElementById("p-ctrl-typing");
      const soundBtn = document.getElementById("p-typing-sound-btn");
      const repeatBtn = document.getElementById("p-typing-repeat-btn");
      const wordSoundBtn = document.getElementById("p-typing-word-sound-btn");
      const wordTransBtn = document.getElementById("p-typing-word-trans-btn");
      const replayBtn = document.getElementById("p-typing-replay-btn");
      const loopBtn = document.getElementById("p-typing-loop-btn");
      const clearBtn = document.getElementById("p-typing-clear-btn");
      const autoToggle = document.getElementById("p-auto-typing-toggle");

      if (display) {
        display.addEventListener("keydown", (e) => {
          // Prevent spacebar from triggering page scroll or window-level actions
          if (e.key === " ") {
            e.preventDefault();
          }

          if (e.key === "Backspace") {
            e.preventDefault();
            if (pTypedBuffer.length > 0) {
              pTypedBuffer = pTypedBuffer.slice(0, -1);
              handlePortraitTypingInput();
            }
            return;
          }
          if (e.key === "Enter") {
            e.preventDefault();
            if (currentSentences && activeSentenceIndex < currentSentences.length) {
              selectSentence(activeSentenceIndex + 1, true);
              syncChannel.postMessage({
                type: "sentence_change",
                data: { sentence_index: activeSentenceIndex, auto_play: false, source: "portrait" }
              });
            }
            return;
          }
          if (e.key === "Escape") {
            display.blur();
            return;
          }
          if (e.key.length !== 1 || e.ctrlKey || e.altKey || e.metaKey) return;
          e.preventDefault();
          if (pTypedBuffer.length < pCurrentTypingTarget.length) {
            pTypedBuffer += e.key;
            handlePortraitTypingInput();
          }
        });

        display.addEventListener("focus", () => {
          display.classList.add("typing-active");
          const card = document.getElementById("p-shadow-typing-card");
          if (card) card.classList.add("focused");
        });
        display.addEventListener("blur", () => {
          display.classList.remove("typing-active");
          const card = document.getElementById("p-shadow-typing-card");
          if (card) card.classList.remove("focused");
        });
      }

      if (navDockBtn) {
        navDockBtn.addEventListener("click", () => {
          const next = (pTypingDock === "portrait") ? "landscape" : "portrait";
          setPortraitTypingDock(next, true);
        });
      }
      if (undockBtn) {
        undockBtn.addEventListener("click", () => {
          setPortraitTypingDock("landscape", true);
        });
      }
      if (ctrlTypingBtn) {
        ctrlTypingBtn.addEventListener("click", () => {
          setPortraitTypingDock("portrait", true);
          setPortraitViewMode("split");
        });
      }

      // Tab switcher
      document.querySelectorAll(".p-panel-tab-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const view = btn.dataset.view;
          if (view !== "notes" && isNotesFullscreen) {
            setPortraitNotesFullscreen(false);
          }
          if (view === "typing" && pTypingDock !== "portrait") {
            setPortraitTypingDock("portrait", true);
          }
          if (view === "notes" && pNotesDock !== "portrait") {
            setPortraitNotesDock("portrait", true);
          }
          setPortraitViewMode(view);
        });
      });

      if (soundBtn) {
        soundBtn.textContent = PortraitSoundEngine.enabled ? "🔊" : "🔇";
        soundBtn.addEventListener("click", () => PortraitSoundEngine.toggle());
      }
      if (repeatBtn) {
        updatePortraitRepeatBtn();
        repeatBtn.addEventListener("click", () => {
          pRepeatRounds = (pRepeatRounds % 3) + 1;
          updatePortraitRepeatBtn();
          try {
            syncChannel.postMessage({ type: "repeat_rounds_changed", data: { rounds: pRepeatRounds } });
          } catch (_) {}
          const targetSent = currentSentences && currentSentences.find(s => s.index === activeSentenceIndex);
          if (targetSent) setupPortraitShadowTyping(targetSent.text);
        });
      }
      if (wordSoundBtn) {
        wordSoundBtn.classList.toggle("active", pIsWordAudioEnabled);
        wordSoundBtn.addEventListener("click", () => {
          pIsWordAudioEnabled = !pIsWordAudioEnabled;
          localStorage.setItem("ai_coach_word_audio", pIsWordAudioEnabled ? "true" : "false");
          wordSoundBtn.classList.toggle("active", pIsWordAudioEnabled);
        });
      }
      if (wordTransBtn) {
        wordTransBtn.classList.toggle("active", pIsWordTransEnabled);
        wordTransBtn.addEventListener("click", () => {
          pIsWordTransEnabled = !pIsWordTransEnabled;
          localStorage.setItem("ai_coach_word_trans", pIsWordTransEnabled ? "true" : "false");
          wordTransBtn.classList.toggle("active", pIsWordTransEnabled);
        });
      }
      if (replayBtn) {
        replayBtn.addEventListener("click", () => {
          playSentenceAudioDirect(activeSentenceIndex);
        });
      }
      if (loopBtn) {
        loopBtn.addEventListener("click", () => {
          isPortraitLoopPlayback = !isPortraitLoopPlayback;
          loopBtn.classList.toggle("active", isPortraitLoopPlayback);
          try {
            syncChannel.postMessage({ type: "loop_mode", data: { loop: isPortraitLoopPlayback } });
          } catch (_) {}
        });
      }
      if (clearBtn) {
        clearBtn.addEventListener("click", () => {
          pTypedBuffer = "";
          pLastTypedLength = 0;
          pLastSpokenWordIdx = -1;
          pCompletedWords.clear();
          const targetSent = currentSentences && currentSentences.find(s => s.index === activeSentenceIndex);
          if (targetSent) setupPortraitShadowTyping(targetSent.text);
        });
      }
      if (autoToggle) {
        const saved = localStorage.getItem("ai_coach_auto_typing");
        if (saved !== null) autoToggle.checked = saved === "1";
        autoToggle.addEventListener("change", () => {
          localStorage.setItem("ai_coach_auto_typing", autoToggle.checked ? "1" : "0");
        });
      }

      // Steppers inside typing card
      const prevPageBtn = document.getElementById("p-studio-prev-page-btn");
      const nextPageBtn = document.getElementById("p-studio-next-page-btn");
      const prevSentBtn = document.getElementById("p-sent-prev-btn");
      const nextSentBtn = document.getElementById("p-sent-next-btn");

      if (prevPageBtn) {
        prevPageBtn.addEventListener("click", () => {
          if (currentPage > 1) loadPage(currentDocId, currentPage - 1, true, 1);
        });
      }
      if (nextPageBtn) {
        nextPageBtn.addEventListener("click", () => {
          loadPage(currentDocId, currentPage + 1, true, 1);
        });
      }
      if (prevSentBtn) {
        prevSentBtn.addEventListener("click", () => {
          if (activeSentenceIndex > 1) {
            selectSentence(activeSentenceIndex - 1, true);
            syncChannel.postMessage({
              type: "sentence_change",
              data: { sentence_index: activeSentenceIndex, auto_play: false, source: "portrait" }
            });
          }
        });
      }
      if (nextSentBtn) {
        nextSentBtn.addEventListener("click", () => {
          if (currentSentences && activeSentenceIndex < currentSentences.length) {
            selectSentence(activeSentenceIndex + 1, true);
            syncChannel.postMessage({
              type: "sentence_change",
              data: { sentence_index: activeSentenceIndex, auto_play: false, source: "portrait" }
            });
          }
        });
      }

      const navNotesBtn = document.getElementById("p-notes-dock-btn");
      const undockNotesBtn = document.getElementById("p-notes-undock-btn");
      const ctrlNotesBtn = document.getElementById("p-ctrl-notes");
      const copyNotesBtn = document.getElementById("p-notes-copy-btn");
      const fsNotesBtn = document.getElementById("p-notes-fs-btn");
      const genNotesBtn = document.getElementById("p-notes-gen-btn");

      if (genNotesBtn) {
        genNotesBtn.addEventListener("click", () => {
          fetchPortraitSmartNotes(true);
        });
      }

      if (fsNotesBtn) {
        fsNotesBtn.addEventListener("click", () => {
          setPortraitNotesFullscreen(!isNotesFullscreen);
        });
      }

      if (navNotesBtn) {
        navNotesBtn.addEventListener("click", () => {
          const next = (pNotesDock === "portrait") ? "landscape" : "portrait";
          setPortraitNotesDock(next, true);
          if (next === "portrait" && !pCurrentNotesMarkdown.trim()) {
            fetchPortraitSmartNotes(false);
          }
        });
      }
      if (undockNotesBtn) {
        undockNotesBtn.addEventListener("click", () => {
          setPortraitNotesFullscreen(false);
          setPortraitNotesDock("landscape", true);
          setPortraitViewMode("split");
        });
      }
      if (ctrlNotesBtn) {
        ctrlNotesBtn.addEventListener("click", () => {
          setPortraitNotesDock("portrait", true);
          setPortraitViewMode("notes");
          if (!pCurrentNotesMarkdown.trim()) {
            fetchPortraitSmartNotes(false);
          }
        });
      }
      if (copyNotesBtn) {
        copyNotesBtn.addEventListener("click", () => {
          if (pCurrentNotesMarkdown) {
            navigator.clipboard.writeText(pCurrentNotesMarkdown).then(() => {
              copyNotesBtn.textContent = "✓ 已复制";
              setTimeout(() => { copyNotesBtn.textContent = "📋 复制"; }, 1500);
            }).catch(() => {});
          }
        });
      }

      setPortraitTypingDock(pTypingDock, false);
      setPortraitNotesDock(pNotesDock, false);
      setPortraitViewMode(pViewMode);
    }

    // Start
    initDocuments();
    initPortraitTheme();
    initPortraitResizer();
    initPortraitTyping();
    refreshPortraitGameStatus();
    try { syncChannel.postMessage({ type: "portrait_connected" }); } catch (_) {}
  </script>
</body>
</html>
