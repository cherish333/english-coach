<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI English Coach · 竖屏教材阅读器</title>
  <link rel="icon" type="image/png" href="/static/icon.png">
  <link rel="stylesheet" href="/static/style.css?v=2.4">
  <style>
    :root {
      --bg-dark: #090d16;
      --surface-dark: #0f172a;
      --card-dark: #1e293b;
      --card-border: #334155;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --accent-glow: rgba(56, 189, 248, 0.25);
      --green: #4ade80;
      --amber: #fbbf24;
      --purple: #a855f7;
    }
    body {
      margin: 0;
      padding: 0;
      background: var(--bg-dark);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .portrait-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    /* Header */
    .portrait-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      background: rgba(15, 23, 42, 0.96);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      z-index: 100;
      height: 52px;
      box-sizing: border-box;
      gap: 12px;
    }
    .portrait-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .portrait-brand h1 {
      font-size: 16px;
      margin: 0;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--accent);
      white-space: nowrap;
    }
    .sync-status {
      font-size: 11px;
      padding: 3px 9px;
      border-radius: 12px;
      background: rgba(34, 197, 94, 0.15);
      color: var(--green);
      border: 1px solid rgba(34, 197, 94, 0.3);
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .sync-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
      animation: pulse-dot 2s infinite ease-in-out;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }

    .portrait-nav {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .portrait-nav select, .portrait-nav input {
      background: #1e293b;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 13px;
      height: 32px;
      box-sizing: border-box;
    }
    .portrait-nav select {
      max-width: 200px;
    }
    .portrait-nav select:focus {
      border-color: var(--accent);
      outline: none;
    }

    /* Top-Bottom Split Layout (上下栏布局) */
    .portrait-body {
      display: flex;
      flex-direction: column; /* 上下栏 */
      flex: 1;
      height: calc(100vh - 52px);
      overflow: hidden;
    }

    /* 上栏：教材完整页面大图视口 */
    .pdf-top-panel {
      height: var(--p-top-h, 58vh);
      flex: 0 0 auto;
      min-height: 120px;
      background: #060911;
      overflow: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }
    .pdf-viewport-inner {
      padding: 16px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-width: 100%;
      box-sizing: border-box;
    }
    .portrait-page-wrapper {
      position: relative;
      display: inline-block;
      max-width: 100%;
      transform-origin: top center;
      transition: transform 0.2s ease;
      user-select: none;
    }
    .pdf-page-img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.75);
      border: 1px solid #1e293b;
      display: block;
    }
    .pdf-highlight-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .pdf-sentence-box {
      position: absolute;
      pointer-events: auto;
      cursor: pointer;
      border-radius: 3px;
      transition: background-color 0.18s ease, box-shadow 0.18s ease;
      z-index: 10;
    }
    .pdf-sentence-box:hover {
      background: rgba(59, 130, 246, 0.22);
      box-shadow: 0 0 0 1.5px rgba(59, 130, 246, 0.5);
    }
    .pdf-sentence-box.active {
      background: rgba(250, 204, 21, 0.45);
      box-shadow: 0 0 0 2px rgba(234, 179, 8, 0.85), 0 2px 10px rgba(234, 179, 8, 0.35);
      z-index: 20;
      animation: p-highlight-pulse 2s infinite ease-in-out;
    }
    @keyframes p-highlight-pulse {
      0%, 100% {
        background: rgba(250, 204, 21, 0.45);
        box-shadow: 0 0 0 2px rgba(234, 179, 8, 0.85), 0 2px 10px rgba(234, 179, 8, 0.35);
      }
      50% {
        background: rgba(250, 204, 21, 0.65);
        box-shadow: 0 0 0 2.5px rgba(234, 179, 8, 1), 0 2px 14px rgba(234, 179, 8, 0.55);
      }
    }
    .pdf-floating-tools {
      position: absolute;
      top: 14px;
      right: 18px;
      display: flex;
      gap: 6px;
      background: rgba(15, 23, 42, 0.85);
      padding: 4px 8px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(6px);
      z-index: 10;
    }
    .tool-mini-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 12px;
      cursor: pointer;
    }
    .tool-mini-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
    }

    /* 竖屏上下拖拽分割条 */
    .portrait-resizer-v {
      height: 8px;
      flex: 0 0 8px;
      cursor: row-resize;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
      background: #111a2e;
      border-top: 1px solid #1e293b;
      border-bottom: 1px solid #1e293b;
      user-select: none;
      touch-action: none;
    }
    .portrait-resizer-v::after {
      content: "";
      width: 44px;
      height: 2px;
      background: #334155;
      border-radius: 2px;
      transition: all 0.2s ease;
    }
    .portrait-resizer-v:hover::after, .portrait-resizer-v.active::after {
      background: var(--accent);
      height: 4px;
      width: 80px;
      box-shadow: 0 0 10px var(--accent-glow);
    }

    /* 下栏：逐句精析与互动控制面板 */
    .sentences-bottom-panel {
      flex: 1 1 0;
      min-height: 160px;
      background: var(--surface-dark);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.4);
    }

    /* 浅色主题支持 (Light Theme Overrides) */
    [data-theme="light"] body {
      background: #f1f5f9;
      color: #0f172a;
    }
    [data-theme="light"] .portrait-header {
      background: rgba(255, 255, 255, 0.96);
      border-bottom-color: #cbd5e1;
    }
    [data-theme="light"] .portrait-brand h1 {
      color: #2563eb;
    }
    [data-theme="light"] .portrait-nav select,
    [data-theme="light"] .portrait-nav input {
      background: #ffffff;
      border-color: #cbd5e1;
      color: #0f172a;
    }
    [data-theme="light"] .portrait-nav .icon-btn {
      color: #334155 !important;
      background: #ffffff !important;
      border-color: #cbd5e1 !important;
    }
    [data-theme="light"] .pdf-top-panel {
      background: #e2e8f0;
    }
    [data-theme="light"] .portrait-resizer-v {
      background: #e2e8f0;
      border-color: #cbd5e1;
    }
    [data-theme="light"] .portrait-resizer-v::after {
      background: #94a3b8;
    }
    [data-theme="light"] .sentences-bottom-panel {
      background: #ffffff;
      box-shadow: 0 -4px 18px rgba(0, 0, 0, 0.08);
    }
    [data-theme="light"] .bottom-control-toolbar {
      background: #f8fafc;
      border-bottom-color: #e2e8f0;
    }
    [data-theme="light"] .sent-progress-pill {
      background: #ffffff;
      color: #0f172a;
      border-color: #cbd5e1;
    }
    [data-theme="light"] .current-focus-card {
      background: #f8fafc;
      border-color: #e2e8f0;
      border-left-color: #2563eb;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    [data-theme="light"] .focus-sentence-text {
      color: #0f172a;
    }
    [data-theme="light"] .sentence-card {
      background: #ffffff;
      border-color: #e2e8f0;
    }
    [data-theme="light"] .sentence-card:hover {
      background: #f8fafc;
      border-color: #cbd5e1;
    }
    [data-theme="light"] .sentence-card.active {
      background: #eff6ff;
      border-color: #93c5fd;
    }
    [data-theme="light"] .sentence-en {
      color: #0f172a;
    }
    [data-theme="light"] .sentence-meta-tag {
      background: #e0f2fe;
      color: #0284c7;
    }
    [data-theme="light"] .p-mode-badge {
      background: #eff6ff;
      border-color: #bfdbfe;
      color: #2563eb;
    }
    [data-theme="light"] .focus-translation-box {
      background: #f8fafc;
      border-color: #e2e8f0;
    }
    [data-theme="light"] .translation-text {
      color: #334155;
    }

    /* 下栏工具条 */
    .bottom-control-toolbar {
      padding: 10px 16px;
      background: #111a2e;
      border-bottom: 1px solid #1e293b;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .toolbar-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sent-progress-pill {
      font-size: 13px;
      font-weight: 700;
      color: #e2e8f0;
      background: #1e293b;
      padding: 4px 10px;
      border-radius: 14px;
      border: 1px solid #334155;
      min-width: 80px;
      text-align: center;
    }

    /* 核心“连续自动精讲”按钮 */
    .btn-continuous {
      background: linear-gradient(135deg, #2563eb, #0284c7);
      color: #fff;
      border: 1px solid #38bdf8;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 13px;
    }
    .btn-continuous:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(56, 189, 248, 0.5);
    }
    .btn-continuous.active {
      background: linear-gradient(135deg, #d97706, #b45309);
      border-color: #f59e0b;
      animation: pulse-border 1.8s infinite ease-in-out;
    }
    @keyframes pulse-border {
      0%, 100% { box-shadow: 0 0 10px rgba(245, 158, 11, 0.4); }
      50% { box-shadow: 0 0 20px rgba(245, 158, 11, 0.8); }
    }

    /* 当前选中句特写栏 */
    .current-focus-card {
      margin: 10px 16px 8px 16px;
      background: linear-gradient(145deg, #182235, #131c2d);
      border: 1px solid #2d3f5e;
      border-left: 4px solid var(--accent);
      border-radius: 10px;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
    }
    .focus-card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .focus-badge {
      font-size: 11px;
      font-weight: 700;
      color: var(--accent);
      background: rgba(56, 189, 248, 0.15);
      padding: 2px 8px;
      border-radius: 4px;
    }
    .focus-status-text {
      font-size: 12px;
      color: #94a3b8;
    }
    .focus-sentence-text {
      font-size: 16px;
      font-weight: 600;
      line-height: 1.5;
      color: #f8fafc;
      letter-spacing: -0.01em;
    }
    .focus-translation-box {
      margin-top: 2px;
      padding: 8px 12px;
      background: rgba(11, 17, 32, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 13px;
      line-height: 1.5;
      transition: all 0.2s ease;
    }
    .focus-translation-box.hidden {
      display: none;
    }
    .translation-prefix {
      font-size: 11px;
      font-weight: 700;
      color: var(--accent);
      background: rgba(56, 189, 248, 0.12);
      padding: 2px 6px;
      border-radius: 4px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .translation-text {
      color: #cbd5e1;
      flex: 1;
    }
    .p-mode-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 6px;
      background: rgba(56, 189, 248, 0.12);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.25);
      white-space: nowrap;
    }

    /* 滚动句子列表 */
    .sentences-scroll-area {
      flex: 1;
      overflow-y: auto;
      padding: 8px 16px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .sentence-card {
      background: #172133;
      border: 1px solid #273549;
      border-radius: 8px;
      padding: 10px 14px;
      cursor: pointer;
      transition: all 0.15s ease;
      position: relative;
    }
    .sentence-card:hover {
      background: #1e2c44;
      border-color: var(--accent);
      transform: translateY(-1px);
    }
    .sentence-card.active {
      background: rgba(56, 189, 248, 0.12);
      border-color: var(--accent);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.25);
    }
    .sentence-card.speaking {
      border-color: #4ade80;
      background: rgba(74, 222, 128, 0.12);
      box-shadow: 0 0 14px rgba(74, 222, 128, 0.3);
    }
    .sentence-card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .sentence-num {
      font-size: 11px;
      font-weight: 700;
      color: #94a3b8;
      background: #111a28;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .sentence-card.active .sentence-num {
      color: var(--accent);
      background: rgba(56, 189, 248, 0.2);
    }
    .sentence-actions-group {
      display: flex;
      gap: 6px;
    }
    .btn-act {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      background: #253348;
      color: #e2e8f0;
      border: 1px solid #334460;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-act:hover {
      background: var(--accent);
      color: #090d16;
      font-weight: 700;
      border-color: var(--accent);
    }
    .sentence-body-text {
      font-size: 14px;
      line-height: 1.5;
      color: #e2e8f0;
      font-weight: 500;
    }
    .inline-play-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      margin-left: 6px;
      padding: 1px 7px;
      border-radius: 12px;
      border: 1px solid #334460;
      background: #1e293b;
      color: #38bdf8;
      font-size: 12px;
      line-height: 18px;
      cursor: pointer;
      vertical-align: middle;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      user-select: none;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
    }
    .inline-play-btn:hover {
      background: #38bdf8;
      color: #090d16;
      border-color: #38bdf8;
      transform: scale(1.08);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
    }
    .inline-play-btn:active {
      transform: scale(0.96);
    }
    .inline-play-btn.playing {
      background: #0284c7;
      color: #ffffff;
      border-color: #38bdf8;
      animation: pulse-audio 1.2s infinite ease-in-out;
    }
    .focus-inline-play {
      font-size: 13px;
      padding: 2px 10px;
      border-radius: 14px;
      margin-left: 8px;
      font-weight: 600;
    }
    @keyframes pulse-audio {
      0% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.7); }
      70% { box-shadow: 0 0 0 8px rgba(56, 189, 248, 0); }
      100% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0); }
    }
    [data-theme="light"] .inline-play-btn {
      background: #f1f5f9;
      border-color: #cbd5e1;
      color: #0284c7;
    }
    [data-theme="light"] .inline-play-btn:hover {
      background: #0284c7;
      color: #ffffff;
      border-color: #0284c7;
    }
    [data-theme="light"] .inline-play-btn.playing {
      background: #0284c7;
      color: #ffffff;
      border-color: #0369a1;
    }

    .empty-prompt {
      text-align: center;
      color: #64748b;
      font-size: 13px;
      margin-top: 30px;
    }
  </style>

</head>
<body>
  <div class="portrait-container">
    <!-- Header -->
    <header class="portrait-header">
      <div class="portrait-brand">
        <h1>📖 竖屏教材端</h1>
        <div class="sync-status" id="sync-indicator">
          <span class="sync-dot"></span>
          <span id="sync-text">已连通</span>
        </div>
        <div class="hud-streak-pill" id="p-hud-streak" style="padding: 2px 8px; font-size: 11px; margin-left: 4px;" title="连续学习天数">🔥 <span id="p-hud-streak-days">1</span>天</div>
        <div class="hud-level-badge" id="p-hud-level" style="font-size: 11px; padding: 2px 8px;" title="当前段位">Lv.1 萌新</div>
      </div>

      <div class="portrait-nav">
        <a href="/" target="_blank" class="btn btn-quiet" style="padding: 4px 8px; font-size: 12px; height: 32px; text-decoration: none; display: inline-flex; align-items: center; color: inherit;" title="打开或聚焦横屏主控制台">🖥️ 主台</a>
        <button id="p-theme-toggle-btn" class="btn btn-quiet" style="padding: 4px 10px; font-size: 12px; height: 32px;" title="切换深色/浅色外观">
          <span id="p-theme-icon">🌙</span> <span id="p-theme-text">深色</span>
        </button>
        <select id="p-doc-select" aria-label="教材"></select>
        <select id="p-unit-select" aria-label="单元"><option value="">单元</option></select>
        <button id="p-prev-page-btn" class="icon-btn" title="上一页" style="color:#f8fafc; background:#1e293b; border-color:#334155;">←</button>
        <span id="p-page-label" style="font-size: 13px; min-width: 55px; text-align: center; color: var(--accent); font-weight: 700;">P. 9</span>
        <button id="p-next-page-btn" class="icon-btn" title="下一页" style="color:#f8fafc; background:#1e293b; border-color:#334155;">→</button>
      </div>
    </header>

    <!-- 上下栏主体 -->
    <div class="portrait-body">
      <!-- 上栏：教材高清页面浏览 -->
      <section class="pdf-top-panel" id="pdf-panel">
        <div class="pdf-floating-tools">
          <button class="tool-mini-btn" id="zoom-in-btn">放大 +</button>
          <button class="tool-mini-btn" id="zoom-out-btn">缩小 -</button>
          <button class="tool-mini-btn" id="zoom-reset-btn">自适应宽</button>
        </div>
        <div class="pdf-viewport-inner">
          <div id="p-pdf-wrapper" class="portrait-page-wrapper">
            <img id="p-page-image" class="pdf-page-img" src="" alt="教材页面加载中...">
            <div id="p-highlight-layer" class="pdf-highlight-layer"></div>
          </div>
        </div>
      </section>

      <!-- 垂直上下拖拽分割条 -->
      <div class="resizer-v portrait-resizer-v" id="portrait-resizer-vertical" title="上下拖动调整教材视口与控制面板高度"></div>

      <!-- 下栏：逐句精讲、连续播放与控制 -->
      <section class="sentences-bottom-panel">
        <!-- 控制工具栏 (纯粹视听导览，去除了冗余打字/发音卡片与风格切换) -->
        <div class="bottom-control-toolbar">
          <div class="toolbar-group">
            <button id="p-ctrl-prev" class="btn btn-quiet" style="padding: 6px 10px;" title="上一句">◀ 上一句</button>
            <span id="p-sent-progress" class="sent-progress-pill">第 1 / 0 句</span>
            <button id="p-ctrl-next" class="btn btn-quiet" style="padding: 6px 10px;" title="下一句">下一句 ▶</button>
          </div>

          <div class="toolbar-group">
            <button id="p-continuous-btn" class="btn btn-continuous" title="从当前句开始自动连续精讲整页所有句子">
              <span id="p-continuous-icon">▶️</span>
              <span id="p-continuous-text">连续自动精讲整页</span>
            </button>
          </div>

          <div class="toolbar-group">
            <button id="p-ctrl-explain" class="btn btn-primary" style="padding: 6px 12px;" title="对当前句进行双语深度精讲">📖 精讲</button>
            <button id="p-ctrl-read" class="btn btn-quiet" style="padding: 6px 12px;" title="播放原声朗读">🔊 纯读</button>
            <button id="p-ctrl-practice" class="btn btn-outline" style="padding: 6px 12px;" title="跟读练习">🎙️ 跟读</button>
          </div>

          <div class="toolbar-group">
            <span class="p-mode-badge" id="p-mode-badge" title="当前教学风格（由横屏主台切换）">🗣️ 口语大师</span>
          </div>
        </div>

        <!-- 当前句聚焦特写与中文对照 (大字号、沉浸阅读) -->
        <div class="current-focus-card" id="p-focus-card">
          <div class="focus-card-meta">
            <div style="display: flex; align-items: center; gap: 8px;">
              <span class="focus-badge" id="p-focus-badge">当前聚焦: 第 1 句</span>
              <span class="focus-status-text" id="p-focus-status">就绪 · 点击上方按钮开始</span>
            </div>
            <div style="display: flex; align-items: center; gap: 6px;">
              <button id="p-focus-trans-toggle" class="btn btn-quiet" style="padding: 2px 8px; font-size: 11px; height: 24px;" title="显示/隐藏中文释义">🇨🇳 译文</button>
            </div>
          </div>
          <div class="focus-sentence-text" id="p-focus-text">正在提取教材句子...</div>
          <!-- 中文释义呈现区 -->
          <div class="focus-translation-box" id="p-focus-trans-box">
            <span class="translation-prefix">🇨🇳 释义</span>
            <span class="translation-text" id="p-focus-trans-text">载入教材后显示中文释义</span>
          </div>
        </div>

        <!-- 句子列表 (全页句子清晰导览，高亮跟随) -->
        <div class="sentences-scroll-area" id="p-sentences-container">
          <div class="empty-prompt">载入教材中...</div>
        </div>
      </section>
    </div>
  </div>

  <script>
    const syncChannel = new BroadcastChannel("english_coach_sync");
    let currentDocId = "vocabulary";
    let currentPage = 9; // Default to Unit 1 rather than empty cover
    let currentSentences = [];
    let activeSentenceIndex = 1;
    let isContinuousActive = false;
    let currentZoom = 1.0;
    // Translation cache & focus state
    const portraitTranslations = {};
    let currentFocusTextCleaned = "";

    function escapeHtml(text) {
      if (text === null || text === undefined) return "";
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // Progress Persistence Manager
    const PROGRESS_STORAGE_KEY = "english_coach_learning_progress";
    let learningProgress = null;
    try {
      const cached = localStorage.getItem(PROGRESS_STORAGE_KEY);
      if (cached) {
        learningProgress = JSON.parse(cached);
        if (learningProgress.last_document_id) {
          currentDocId = learningProgress.last_document_id;
        }
      }
    } catch (_) {}

    async function fetchLearningProgress() {
      try {
        const res = await fetch("/api/progress");
        if (res.ok) {
          learningProgress = await res.json();
          try { localStorage.setItem(PROGRESS_STORAGE_KEY, JSON.stringify(learningProgress)); } catch (_) {}
        }
      } catch (e) {
        console.warn("Portrait: failed to fetch progress:", e);
      }
      return learningProgress;
    }

    function savePortraitProgress(updates) {
      if (!updates) return;
      if (!learningProgress) learningProgress = {};
      Object.assign(learningProgress, updates);
      if (!learningProgress.books) learningProgress.books = {};
      if (updates.document_id) {
        const prevBook = learningProgress.books[updates.document_id] || {};
        learningProgress.books[updates.document_id] = {
          last_page: updates.page ?? (prevBook.last_page || 1),
          last_sentence_index: updates.sentence_index ?? (prevBook.last_sentence_index || 1),
          updated_at: new Date().toISOString()
        };
      }
      try { localStorage.setItem(PROGRESS_STORAGE_KEY, JSON.stringify(learningProgress)); } catch (_) {}
      try {
        fetch("/api/progress", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(updates),
        }).catch(() => {});
      } catch (_) {}
    }

    const docSelect = document.getElementById("p-doc-select");
    const unitSelect = document.getElementById("p-unit-select");
    const pageImg = document.getElementById("p-page-image");
    const pageLabel = document.getElementById("p-page-label");
    const sentContainer = document.getElementById("p-sentences-container");
    const sentProgress = document.getElementById("p-sent-progress");
    const focusBadge = document.getElementById("p-focus-badge");
    const focusStatus = document.getElementById("p-focus-status");
    const focusText = document.getElementById("p-focus-text");
    const continuousBtn = document.getElementById("p-continuous-btn");
    const continuousIcon = document.getElementById("p-continuous-icon");
    const continuousText = document.getElementById("p-continuous-text");
    const pFocusTransBox = document.getElementById("p-focus-trans-box");
    const pFocusTransText = document.getElementById("p-focus-trans-text");
    const pFocusTransToggle = document.getElementById("p-focus-trans-toggle");

    let currentPortraitActionMode = localStorage.getItem("ai_coach_action_mode") || "explain";

    // Listen to sync events from landscape master window
    syncChannel.onmessage = (event) => {
      const { type, data } = event.data || {};
      if (type === "page_updated") {
        if (data.document_id !== currentDocId || data.page !== currentPage) {
          currentDocId = data.document_id;
          currentPage = data.page;
          loadPage(currentDocId, currentPage, false);
        }
      } else if (type === "sentence_selected") {
        selectSentence(data.sentence_index, false);
      } else if (type === "continuous_progress") {
        updateContinuousState(data.running, data.sentence_index);
      } else if (type === "action_mode") {
        if (data && data.mode) {
          currentPortraitActionMode = data.mode;
        }
      } else if (type === "teaching_style") {
        if (data && data.style) {
          updatePortraitStyleBadge(data.style);
          savePortraitProgress({ teaching_style: data.style });
        }
      } else if (type === "pronunciation_eval") {
        if (data && data.score !== undefined) {
          focusStatus.textContent = `🎙️ 发音评测: ${data.score}分`;
        }
      } else if (type === "document_uploaded") {
        initDocuments();
      } else if (type === "theme_changed") {
        if (data && data.theme) {
          applyPortraitTheme(data.theme, false);
        }
      } else if (type === "game_status_updated") {
        if (data) {
          updatePortraitHud(data);
        }
      } else if (type === "sentence_translation") {
        // Landscape window fetched a translation — cache it and update UI if it matches current focus
        if (data && data.text && data.translation) {
          portraitTranslations[data.text] = data.translation;
          if (currentFocusTextCleaned === data.text && pFocusTransText) {
            pFocusTransText.textContent = data.translation;
          }
        }
      }
    };

    const styleLabels = {
      spoken: "🗣️ 口语大师",
      history: "🏛️ 文史精读",
      ielts: "🎓 雅思学术",
      grammar: "🧩 句法拆解",
      drill: "⚡ 刷题速成"
    };

    function updatePortraitStyleBadge(style) {
      const badge = document.getElementById("p-mode-badge");
      if (badge && style) {
        badge.textContent = styleLabels[style] || style;
      }
    }

    function updateContinuousState(running, activeIdx) {

      isContinuousActive = !!running;
      if (isContinuousActive) {
        continuousBtn.classList.add("active");
        continuousIcon.textContent = "⏸️";
        continuousText.textContent = "暂停连续讲解";
        focusStatus.textContent = "⚡ 正在连续自动精讲中...";
        if (activeIdx) selectSentence(activeIdx, false);
      } else {
        continuousBtn.classList.remove("active");
        continuousIcon.textContent = "▶️";
        continuousText.textContent = "连续自动精讲整页";
        focusStatus.textContent = "已就绪";
      }
    }

    async function initDocuments() {
      try {
        await fetchLearningProgress();
        if (learningProgress) {
          if (learningProgress.teaching_style) {
            updatePortraitStyleBadge(learningProgress.teaching_style);
          }
          if (learningProgress.last_document_id) {
            currentDocId = learningProgress.last_document_id;
          }
        }

        const res = await fetch("/api/documents");
        const data = await res.json();
        const docs = data.documents || [];
        if (!docs.length) return;

        if (!docs.some(d => d.id === currentDocId)) {
          currentDocId = docs[0].id;
        }

        docSelect.innerHTML = docs.map(d => `<option value="${escapeHtml(d.id)}" ${d.id === currentDocId ? 'selected' : ''}>${escapeHtml(d.title)}</option>`).join("");
        docSelect.onchange = async () => {
          currentDocId = docSelect.value;
          if (currentDocId === "west_civ") {
            updatePortraitStyleBadge("history");
            try { syncChannel.postMessage({ type: "teaching_style", data: { style: "history" } }); } catch (_) {}
            savePortraitProgress({ teaching_style: "history" });
          }
          
          let targetPage = null;
          let targetSentence = null;
          if (learningProgress && learningProgress.books && learningProgress.books[currentDocId]) {
            targetPage = learningProgress.books[currentDocId].last_page;
            targetSentence = learningProgress.books[currentDocId].last_sentence_index;
          }
          if (!targetPage) {
            targetPage = currentDocId === "west_civ" ? 38 : (currentDocId === "vocabulary" || currentDocId === "grammar" ? 9 : 1);
          }
          if (!targetSentence) {
            targetSentence = 1;
          }
          currentPage = targetPage;
          await loadUnits(targetSentence);
        };

        let initialPage = null;
        let initialSentence = null;
        if (learningProgress) {
          if (learningProgress.books && learningProgress.books[currentDocId]) {
            initialPage = learningProgress.books[currentDocId].last_page;
            initialSentence = learningProgress.books[currentDocId].last_sentence_index;
          } else if (learningProgress.last_document_id === currentDocId) {
            initialPage = learningProgress.last_page;
            initialSentence = learningProgress.last_sentence_index;
          }
        }
        if (!initialPage) {
          initialPage = currentDocId === "west_civ" ? 38 : (currentDocId === "vocabulary" || currentDocId === "grammar" ? 9 : 1);
        }
        if (!initialSentence) {
          initialSentence = 1;
        }
        currentPage = initialPage;
        await loadUnits(initialSentence);
      } catch (err) {
        console.error("Failed to init documents", err);
      }
    }

    async function loadUnits(targetSentence = null) {
      try {
        const res = await fetch(`/api/documents/${currentDocId}/units`);
        const data = await res.json();
        const units = data.units || [];
        unitSelect.innerHTML = `<option value="">选择单元</option>` + units.map(u => {
          const label = (u.title && (u.title.startsWith("Ch.") || u.title.startsWith("Chapter") || u.title.startsWith("Unit")))
            ? `${escapeHtml(u.title)}`
            : `Unit ${escapeHtml(String(u.unit))}: ${escapeHtml(u.title)} (P.${u.page})`;
          return `<option value="${u.page}">${label}</option>`;
        }).join("");
        
        unitSelect.onchange = () => {
          if (unitSelect.value) {
            currentPage = parseInt(unitSelect.value);
            loadPage(currentDocId, currentPage, true, 1);
          }
        };

        // If page is 1 (cover) and units exist, auto-advance to Unit 1 page!
        if (currentPage <= 1 && units.length > 0) {
          currentPage = units[0].page;
        }
        const matchedUnit = [...units].reverse().find(u => u.page <= currentPage);
        if (matchedUnit) {
          unitSelect.value = matchedUnit.page;
        }

        await loadPage(currentDocId, currentPage, true, targetSentence);
      } catch (err) {
        console.error("Failed to load units", err);
      }
    }

    async function loadPage(docId, pageNum, broadcast = true, targetSentence = null) {
      currentDocId = docId;
      currentPage = pageNum;
      docSelect.value = docId;
      pageLabel.textContent = `P. ${pageNum}`;
      pageImg.src = `/api/documents/${docId}/pages/${pageNum}/image?t=${Date.now()}`;

      if (broadcast) {
        syncChannel.postMessage({
          type: "page_change_requested",
          data: { document_id: docId, page: pageNum }
        });
      }

      savePortraitProgress({
        document_id: docId,
        page: pageNum,
        sentence_index: targetSentence || activeSentenceIndex || 1
      });

      // Fetch sentences
      try {
        const res = await fetch(`/api/documents/${docId}/pages/${pageNum}/sentences`);
        const data = await res.json();
        currentSentences = data.sentences || [];
        renderSentences(currentSentences);
        renderPortraitHighlights(currentSentences);
        if (currentSentences.length > 0) {
          const sentIdx = targetSentence ? Math.max(1, Math.min(targetSentence, currentSentences.length)) : 1;
          selectSentence(sentIdx, false);
        }
      } catch (err) {
        console.error("Failed to fetch sentences", err);
      }
    }

    let currentAudioPlayback = null;
    let currentAudioBtn = null;

    function playSentenceAudioDirect(index, btnEl) {
      const sentenceObj = currentSentences.find(s => s.index === index);
      if (!sentenceObj || !sentenceObj.text) return;
      const text = sentenceObj.text.trim();
      if (!text) return;

      selectSentence(index, false);
      focusStatus.textContent = "正在朗读原句...";

      // Stop previous audio
      if (currentAudioPlayback) {
        try {
          currentAudioPlayback.onended = null;
          currentAudioPlayback.onerror = null;
          currentAudioPlayback._cancelled = true;
          currentAudioPlayback.pause();
          currentAudioPlayback.src = "";
        } catch (_) {}
        currentAudioPlayback = null;
      }
      if (currentAudioBtn) {
        currentAudioBtn.classList.remove("playing");
        currentAudioBtn = null;
      }

      // Sync visual state across all play buttons for this sentence index
      const matchingBtns = document.querySelectorAll(`.inline-play-btn[data-index="${index}"]`);
      matchingBtns.forEach(b => b.classList.add("playing"));
      if (btnEl) {
        btnEl.classList.add("playing");
        currentAudioBtn = btnEl;
      }

      let voice = "en-US-JennyNeural";
      const savedVoice = localStorage.getItem("ai_coach_voice");
      if (savedVoice && (savedVoice.startsWith("en-") || savedVoice.startsWith("zh-"))) {
        voice = savedVoice;
      }
      const speedVal = localStorage.getItem("ai_coach_speed") || "1.0";
      const audioUrl = `/api/tts?text=${encodeURIComponent(text)}&voice=${encodeURIComponent(voice)}&speed=${encodeURIComponent(speedVal)}`;
      const audio = new Audio(audioUrl);
      audio._cancelled = false;
      currentAudioPlayback = audio;

      const finishPlaying = () => {
        matchingBtns.forEach(b => b.classList.remove("playing"));
        if (btnEl) btnEl.classList.remove("playing");
        if (currentAudioBtn === btnEl) currentAudioBtn = null;
        if (currentAudioPlayback === audio) currentAudioPlayback = null;
        if (focusStatus && focusStatus.textContent === "正在朗读原句...") {
          focusStatus.textContent = "朗读完成";
        }
      };

      audio.onended = finishPlaying;
      audio.onerror = (err) => {
        if (audio._cancelled || !audio.src || audio.src === window.location.href) {
          finishPlaying();
          return;
        }
        console.warn("Direct TTS failed, falling back to Web Speech:", err);
        finishPlaying();
        if ('speechSynthesis' in window) {
          try {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'en-US';
            u.onend = finishPlaying;
            u.onerror = finishPlaying;
            matchingBtns.forEach(b => b.classList.add("playing"));
            window.speechSynthesis.speak(u);
          } catch (_) {
            finishPlaying();
          }
        }
      };

      audio.play().catch(err => {
        console.warn("Audio play blocked or interrupted:", err);
        finishPlaying();
      });
    }

    function renderSentences(sentences) {
      sentProgress.textContent = `第 ${activeSentenceIndex || 1} / ${sentences.length} 句`;
      if (!sentences || sentences.length === 0) {
        sentContainer.innerHTML = `<div class="empty-prompt">本页未提取到独立文本句子</div>`;
        focusText.textContent = "本页未提取到独立文本句子";
        return;
      }

      sentContainer.innerHTML = sentences.map(s => `
        <div class="sentence-card ${activeSentenceIndex === s.index ? 'active' : ''}" id="sent-card-${s.index}" onclick="handlePortraitCardClick(${s.index})">
          <div class="sentence-card-meta">
            <span class="sentence-num">#${s.index}</span>
            <div class="sentence-actions-group" onclick="event.stopPropagation()">
              <button class="btn-act" onclick="playSentenceAudioDirect(${s.index}, this)" title="播放原音朗读">🔊 读</button>
              <button class="btn-act" onclick="triggerSentence(${s.index}, 'explain')" title="双语精讲">📖 讲</button>
              <button class="btn-act" onclick="triggerSentence(${s.index}, 'practice')" title="跟读练习">🎙️ 练</button>
            </div>
          </div>
          <div class="sentence-body-text">
            <span class="sentence-text-val">${escapeHtml(s.text)}</span>
            <button class="inline-play-btn" data-index="${s.index}" onclick="event.stopPropagation(); playSentenceAudioDirect(${s.index}, this)" title="播放原句读音" aria-label="播放原句读音">🔊</button>
          </div>
        </div>
      `).join("");
    }

    function renderPortraitHighlights(sentences) {
      const layer = document.getElementById("p-highlight-layer");
      if (!layer) return;
      layer.innerHTML = "";
      if (!sentences || sentences.length === 0) return;

      sentences.forEach((sent) => {
        const boxes = sent.boxes || [];
        boxes.forEach((box, bIdx) => {
          const boxEl = document.createElement("div");
          boxEl.className = "pdf-sentence-box";
          boxEl.dataset.idx = sent.index;
          boxEl.dataset.boxIdx = bIdx;
          boxEl.style.left = `${box.x}%`;
          boxEl.style.top = `${box.y}%`;
          boxEl.style.width = `${box.w}%`;
          boxEl.style.height = `${box.h}%`;
          boxEl.title = `第 ${sent.index} 句 · 点击定位学习\n"${(sent.text || '').slice(0, 60)}"`;

          // Interactive Point-and-Read on portrait screen
          boxEl.addEventListener("click", (e) => {
            e.stopPropagation();
            selectSentence(sent.index, true);
            syncChannel.postMessage({
              type: "sentence_selected",
              data: { sentence_index: sent.index }
            });
          });

          layer.appendChild(boxEl);
        });
      });

      highlightPortraitSentence(activeSentenceIndex, false);
    }

    function highlightPortraitSentence(index, scroll = true) {
      const layer = document.getElementById("p-highlight-layer");
      if (!layer) return;

      const allBoxes = layer.querySelectorAll(".pdf-sentence-box");
      let firstActiveEl = null;

      allBoxes.forEach((b) => {
        const bIdx = parseInt(b.dataset.idx, 10);
        const isActive = (bIdx === index);
        b.classList.toggle("active", isActive);
        if (isActive && !firstActiveEl) {
          firstActiveEl = b;
        }
      });

      if (firstActiveEl && scroll) {
        const panel = document.getElementById("pdf-panel");
        if (panel) {
          const panelRect = panel.getBoundingClientRect();
          const elRect = firstActiveEl.getBoundingClientRect();
          if (elRect.top < panelRect.top + 30 || elRect.bottom > panelRect.bottom - 30) {
            firstActiveEl.scrollIntoView({ behavior: "smooth", block: "center" });
          }
        }
      }
    }

    function selectSentence(index, scroll = true) {
      if (!currentSentences || currentSentences.length === 0) return;
      index = Math.max(1, Math.min(index, currentSentences.length));
      activeSentenceIndex = index;
      sentProgress.textContent = `第 ${index} / ${currentSentences.length} 句`;
      focusBadge.textContent = `当前聚焦: 第 ${index} 句`;

      const targetSent = currentSentences.find(s => s.index === index);
      if (targetSent) {
        focusText.innerHTML = `<span class="focus-text-val">${escapeHtml(targetSent.text)}</span> <button class="inline-play-btn focus-inline-play" data-index="${index}" onclick="event.stopPropagation(); playSentenceAudioDirect(${index}, this)" title="播放当前句读音" aria-label="播放当前句读音">🔊 听读音</button>`;
        const cleanedText = (targetSent.text || "").replace(/[\u00a0\u202f\u2009\u3000]/g, " ").replace(/\s+/g, " ").trim();
        const cachedTrans = portraitTranslations[cleanedText] || targetSent.translation || null;
        updateFocusTranslation(cleanedText, cachedTrans);
      }

      document.querySelectorAll(".sentence-card").forEach(el => el.classList.remove("active"));
      const card = document.getElementById(`sent-card-${index}`);
      if (card) {
        card.classList.add("active");
        if (scroll) {
          card.scrollIntoView({ behavior: "smooth", block: "nearest" });
        }
      }

      // Update PDF page real-time highlight on portrait screen
      highlightPortraitSentence(index, scroll);

      if (currentDocId && currentPage) {
        savePortraitProgress({
          document_id: currentDocId,
          page: currentPage,
          sentence_index: index
        });
      }
    }

    function triggerSentence(index, action = "explain") {
      selectSentence(index);
      const sentenceObj = currentSentences.find(s => s.index === index);
      if (!sentenceObj) return;

      const labels = {
        "explain": "正在双语精讲...",
        "read_only": "正在纯原音朗读...",
        "practice": "正在跟读练习..."
      };
      focusStatus.textContent = labels[action] || "正在讲解...";

      // Send to main landscape window
      syncChannel.postMessage({
        type: "sentence_action_requested",
        data: {
          sentence_index: index,
          sentence_text: sentenceObj.text,
          action: action,
          document_id: currentDocId,
          page: currentPage
        }
      });
    }

    function handlePortraitCardClick(index) {
      selectSentence(index);
      const isPure = (currentPortraitActionMode === "read_only" || currentPortraitActionMode === "continuous_read");
      if (isPure) {
        triggerSentence(index, "read_only");
      } else if (currentPortraitActionMode === "practice") {
        triggerSentence(index, "practice");
      } else {
        triggerSentence(index, "explain");
      }
    }

    // Toggle continuous lecture
    continuousBtn.onclick = () => {
      isContinuousActive = !isContinuousActive;
      updateContinuousState(isContinuousActive, activeSentenceIndex);
      const isPure = (currentPortraitActionMode === "read_only" || currentPortraitActionMode === "continuous_read");
      syncChannel.postMessage({
        type: "toggle_continuous_lecture",
        data: {
          active: isContinuousActive,
          start_index: activeSentenceIndex || 1,
          action: isPure ? "read_only" : "explain",
          document_id: currentDocId,
          page: currentPage
        }
      });
    };

    // Nav controls
    document.getElementById("p-prev-page-btn").onclick = () => {
      if (currentPage > 1) loadPage(currentDocId, currentPage - 1, true);
    };
    document.getElementById("p-next-page-btn").onclick = () => {
      loadPage(currentDocId, currentPage + 1, true);
    };

    // Stepper buttons
    document.getElementById("p-ctrl-prev").onclick = () => {
      if (activeSentenceIndex > 1) handlePortraitCardClick(activeSentenceIndex - 1);
    };
    document.getElementById("p-ctrl-next").onclick = () => {
      if (activeSentenceIndex < currentSentences.length) handlePortraitCardClick(activeSentenceIndex + 1);
    };

    // Action buttons
    document.getElementById("p-ctrl-explain").onclick = () => {
      if (activeSentenceIndex) triggerSentence(activeSentenceIndex, "explain");
    };
    document.getElementById("p-ctrl-read").onclick = () => {
      if (activeSentenceIndex) triggerSentence(activeSentenceIndex, "read_only");
    };
    document.getElementById("p-ctrl-practice").onclick = () => {
      if (activeSentenceIndex) triggerSentence(activeSentenceIndex, "practice");
    };

    // Zoom controls for PDF
    const pPdfWrapper = document.getElementById("p-pdf-wrapper");
    const pTarget = pPdfWrapper || pageImg;
    document.getElementById("zoom-in-btn").onclick = () => {
      currentZoom = Math.min(currentZoom + 0.15, 2.0);
      pTarget.style.transform = `scale(${currentZoom})`;
      pTarget.style.transformOrigin = "top center";
    };
    document.getElementById("zoom-out-btn").onclick = () => {
      currentZoom = Math.max(currentZoom - 0.15, 0.6);
      pTarget.style.transform = `scale(${currentZoom})`;
      pTarget.style.transformOrigin = "top center";
    };
    document.getElementById("zoom-reset-btn").onclick = () => {
      currentZoom = 1.0;
      pTarget.style.transform = `scale(1.0)`;
    };

    // Focus Translation & HUD Management
    if (pFocusTransToggle) {
      pFocusTransToggle.addEventListener("click", () => {
        if (pFocusTransBox) {
          const isHidden = pFocusTransBox.classList.toggle("hidden");
          pFocusTransToggle.classList.toggle("active", !isHidden);
          pFocusTransToggle.title = isHidden ? "显示参考译文" : "隐藏参考译文";
        }
      });
    }

    function updateFocusTranslation(text, cachedTranslation = null) {
      if (!pFocusTransText) return;
      if (!text) {
        pFocusTransText.textContent = "载入教材后显示中文释义";
        return;
      }
      const cleaned = text.replace(/[\u00a0\u202f\u2009\u3000]/g, " ").replace(/\s+/g, " ").trim();
      currentFocusTextCleaned = cleaned;
      if (cachedTranslation || portraitTranslations[cleaned]) {
        pFocusTransText.textContent = cachedTranslation || portraitTranslations[cleaned];
      } else {
        pFocusTransText.textContent = "正在获取中文释义...";
        fetchPortraitTranslation(cleaned);
      }
    }

    async function fetchPortraitTranslation(text) {
      if (!text) return "";
      const cleaned = text.replace(/[\u00a0\u202f\u2009\u3000]/g, " ").replace(/\s+/g, " ").trim();
      if (!cleaned) return "";
      if (portraitTranslations[cleaned]) return portraitTranslations[cleaned];

      try {
        const res = await fetch("/api/translate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: cleaned })
        });
        if (res.ok) {
          const data = await res.json();
          if (data.translation) {
            portraitTranslations[cleaned] = data.translation;
            if (currentFocusTextCleaned === cleaned && pFocusTransText) {
              pFocusTransText.textContent = data.translation;
            }
            try { syncChannel.postMessage({ type: "sentence_translation", data: { text: cleaned, translation: data.translation } }); } catch (_) {}
            return data.translation;
          }
        }
      } catch (err) {
        console.warn("Portrait translation fetch failed:", err);
      }
      return "";
    }

    function updatePortraitHud(data) {
      if (!data) return;
      const streakDays = document.getElementById("p-hud-streak-days");
      const levelBadge = document.getElementById("p-hud-level");
      if (streakDays && data.streak_days !== undefined) {
        streakDays.textContent = data.streak_days;
      }
      if (levelBadge && (data.level !== undefined || data.title)) {
        levelBadge.textContent = data.title || `Lv.${data.level}`;
      }
    }

    async function refreshPortraitGameStatus() {
      try {
        const res = await fetch("/api/game/status");
        if (!res.ok) return;
        const data = await res.json();
        updatePortraitHud(data);
      } catch (err) {
        console.warn("Failed to fetch portrait game status:", err);
      }
    }

    // Theme Management for Portrait
    function applyPortraitTheme(theme, broadcast = true) {
      document.documentElement.setAttribute("data-theme", theme);
      document.body.setAttribute("data-theme", theme);
      localStorage.setItem("ai_coach_theme", theme);
      const icon = document.getElementById("p-theme-icon");
      const text = document.getElementById("p-theme-text");
      if (icon) icon.textContent = theme === "dark" ? "🌙" : "☀️";
      if (text) text.textContent = theme === "dark" ? "深色" : "浅色";
      if (broadcast) {
        try {
          syncChannel.postMessage({ type: "theme_changed", data: { theme } });
        } catch (_) {}
      }
    }

    function initPortraitTheme() {
      const savedTheme = localStorage.getItem("ai_coach_theme") || "dark";
      applyPortraitTheme(savedTheme, false);
      const btn = document.getElementById("p-theme-toggle-btn");
      if (btn) {
        btn.addEventListener("click", () => {
          const current = document.documentElement.getAttribute("data-theme") || "dark";
          const next = current === "dark" ? "light" : "dark";
          applyPortraitTheme(next, true);
        });
      }
    }

    // Vertical Split Resizer for Portrait
    function initPortraitResizer() {
      const pdfPanel = document.getElementById("pdf-panel");
      const resizer = document.getElementById("portrait-resizer-vertical");
      const body = document.querySelector(".portrait-body");
      if (!pdfPanel || !resizer || !body) return;

      const savedTopH = parseInt(localStorage.getItem("ai_coach_portrait_top_h"), 10);
      if (savedTopH && savedTopH >= 120 && savedTopH <= window.innerHeight - 180) {
        pdfPanel.style.height = savedTopH + "px";
      }

      let isDragging = false;
      resizer.addEventListener("pointerdown", (e) => {
        isDragging = true;
        resizer.classList.add("active");
        document.body.classList.add("is-resizing", "is-resizing-v");
        resizer.setPointerCapture(e.pointerId);
        e.preventDefault();
      });

      resizer.addEventListener("pointermove", (e) => {
        if (!isDragging) return;
        const bodyRect = body.getBoundingClientRect();
        let newH = e.clientY - bodyRect.top;
        const maxH = bodyRect.height - 160;
        newH = Math.max(120, Math.min(newH, maxH));
        pdfPanel.style.height = newH + "px";
      });

      const finish = (e) => {
        if (!isDragging) return;
        isDragging = false;
        resizer.classList.remove("active");
        document.body.classList.remove("is-resizing", "is-resizing-v");
        try { resizer.releasePointerCapture(e.pointerId); } catch (_) {}
        const h = parseInt(pdfPanel.style.height, 10);
        if (h) localStorage.setItem("ai_coach_portrait_top_h", h);
      };

      resizer.addEventListener("pointerup", finish);
      resizer.addEventListener("pointercancel", finish);
    }

    // Start
    initDocuments();
    initPortraitTheme();
    initPortraitResizer();
    refreshPortraitGameStatus();
    try { syncChannel.postMessage({ type: "portrait_connected" }); } catch (_) {}
  </script>
</body>
</html>
